{# 
   Shared Tag Editor Form Fields
   Include this inside a <form> element. Uses searchable dropdowns for topics/chapters.
   Element IDs use "edit" prefix: editLevel, editQType, editMajorTopic, etc.
   Requires partials/tag_editor_js.html to be included in the page's <script> block.
#}
<div id="editStemTagsNote" class="alert alert-secondary py-2 small d-none">
    <i class="bi bi-diagram-3"></i>
    <span class="union-text">{{ t('Tags live on parts; this stem inherits the union at filter time.') }}</span>
</div>
<div class="row g-3">
    <div class="col-lg-2 col-md-4">
        <label class="form-label">{{ t('Level') }}</label>
        <select class="form-select" id="editLevel" name="level">
            <option value="">{{ t('None') }}</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
    </div>
    <div class="col-lg-3 col-md-4">
        <label class="form-label">{{ t('Question Type') }}</label>
        <select class="form-select" id="editQType" name="q_type">
            <option value="">{{ t('None') }}</option>
            <option value="MC">{{ t('Multiple Choice') }}</option>
            <option value="CQ">{{ t('Conventional Question') }}</option>
        </select>
    </div>
    <div class="col-lg-3 col-md-4">
        <label class="form-label">{{ t('Section') }}</label>
        <input type="text" class="form-control" id="editSection" name="section" 
               placeholder="{{ t('A, B, or leave empty') }}">
    </div>
    <div class="col-lg-2 col-md-4">
        <label class="form-label">{{ t('Correct %') }}</label>
        <input type="number" class="form-control" id="editCorrectPercentage" name="correct_percentage" 
               min="0" max="100" placeholder="{{ t('0-100') }}">
    </div>
    <div class="col-lg-2 col-md-4">
        <label class="form-label">{{ t('Marks') }}</label>
        <input type="number" class="form-control" id="editMarks" name="marks"
               min="0" max="999" step="1" placeholder="{{ t('e.g. 4') }}"
               title="{{ t('Marks printed for this question / part. A stem\'s total is the sum of its parts.') }}">
        <div id="editMarksTotal" class="form-text d-none"></div>
    </div>
</div>

<div class="row g-3 mt-1">
    <div class="col-lg-4 col-md-6">
        <label class="form-label">{{ t('Description') }}</label>
        <textarea class="form-control" id="editDescription" name="description" 
                  rows="2" placeholder="{{ t('Optional description') }}"></textarea>
    </div>
    <div class="col-lg-4 col-md-6">
        <div class="d-flex justify-content-between align-items-center">
            <label class="form-label mb-0">{{ t('Answer Text') }}</label>
            <div class="btn-group btn-group-sm" id="editAnswerAiBtns">
                <button type="button" class="btn btn-outline-dark" onclick="openAnswerTextAiModal('generate')">
                    <i class="bi bi-lightbulb"></i> {{ t('Generate') }}
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="openAnswerTextAiModal('check')">
                    <i class="bi bi-robot"></i> {{ t('Check') }}
                </button>
            </div>
        </div>
        <textarea class="form-control" id="editAnswer" name="answer" 
                  rows="2" placeholder="{{ t('Plain text answer (alt to ANS image)') }}"></textarea>
        <div id="editAnswerAiStatus" class="form-text"></div>
    </div>
    <div class="col-lg-4 col-md-6">
        <label class="form-label">{{ t('Comment') }}</label>
        <textarea class="form-control" id="editComment" name="comment" 
                  rows="2" placeholder="{{ t('Notes') }}"></textarea>
    </div>
</div>

<hr>
<h6 class="mb-3"><i class="bi bi-tags"></i> {{ t('Topic Tagging') }}</h6>

<div class="row g-3">
    {# Major Topic - searchable single-select #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Major Topic (select 1)') }}</label>
        <div class="dropdown searchable-single-select" id="editMajorTopicDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editMajorTopicLabel">{{ t('None') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editMajorTopicSearch" placeholder="{{ t('Search topics...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditMajorTopicSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div id="editMajorTopicOptions" class="searchable-options-list" style="max-height: 200px; overflow-y: auto;">
                </div>
            </div>
        </div>
        <input type="hidden" id="editMajorTopic" name="major_topic_id" value="">
    </div>

    {# Major Subtopic - searchable single-select #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Major Subtopic') }}</label>
        <div class="dropdown searchable-single-select" id="editMajorSubtopicDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editMajorSubtopicLabel">{{ t('None') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editMajorSubtopicSearch" placeholder="{{ t('Search subtopics...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditMajorSubtopicSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div id="editMajorSubtopicOptions" class="searchable-options-list" style="max-height: 200px; overflow-y: auto;">
                    <div class="searchable-option" data-value="" onclick="selectEditMajorSubtopic('', '')">{{ t('None') }}</div>
                </div>
            </div>
        </div>
        <input type="hidden" id="editMajorSubtopic" name="major_subtopic_id" value="">
        <small class="text-muted">{{ t('Select major topic first to see subtopics') }}</small>
    </div>
</div>

<div class="row g-3 mt-1">
    {# Minor Topics - multi-select with checkboxes #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Minor Topics (multiple)') }}</label>
        <div class="dropdown multi-select-dropdown" id="editMinorTopicsDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editMinorTopicsLabel">{{ t('None selected') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editMinorTopicsSearch" placeholder="{{ t('Search topics...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditMinorTopicsSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div class="d-flex gap-1 mb-2">
                    <button type="button" class="btn btn-outline-primary btn-sm flex-grow-1" onclick="selectAllEditMinorTopics()">{{ t('All') }}</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1" onclick="clearAllEditMinorTopics()">{{ t('None') }}</button>
                </div>
                <div id="editMinorTopicsCheckboxes" class="multi-select-checkbox-list" style="max-height: 200px; overflow-y: auto;">
                </div>
            </div>
        </div>
        <!-- Hidden select to store values -->
        <select id="editMinorTopics" name="minor_topic_ids" multiple style="display:none;"></select>
    </div>

    {# Subtopics - multi-select with checkboxes #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Subtopics (from Major + Minor Topics)') }}</label>
        <div class="dropdown multi-select-dropdown" id="editSubtopicsDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editSubtopicsLabel">{{ t('None selected') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editSubtopicsSearch" placeholder="{{ t('Search subtopics...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditSubtopicsSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div class="d-flex gap-1 mb-2">
                    <button type="button" class="btn btn-outline-primary btn-sm flex-grow-1" onclick="selectAllEditSubtopics()">{{ t('All') }}</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm flex-grow-1" onclick="clearAllEditSubtopics()">{{ t('None') }}</button>
                </div>
                <div id="editSubtopicsCheckboxes" class="multi-select-checkbox-list" style="max-height: 200px; overflow-y: auto;">
                </div>
            </div>
        </div>
        <!-- Hidden select to store values -->
        <select id="editSubtopics" name="subtopic_ids" multiple style="display:none;"></select>
        <small class="text-muted">{{ t('All subtopics shown (including hidden ones)') }}</small>
    </div>
</div>

<hr>
<h6 class="mb-3"><i class="bi bi-book"></i> {{ t('Chapter Tagging') }}</h6>

<div class="row g-3">
    {# Chapter - searchable single-select #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Chapter') }}</label>
        <div class="dropdown searchable-single-select" id="editChapterDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editChapterLabel">{{ t('None') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editChapterSearch" placeholder="{{ t('Search chapters...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditChapterSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div id="editChapterOptions" class="searchable-options-list" style="max-height: 200px; overflow-y: auto;">
                </div>
            </div>
        </div>
        <input type="hidden" id="editChapter" name="chapter_id" value="">
    </div>

    {# Subchapter - searchable single-select #}
    <div class="col-lg-6 col-md-6">
        <label class="form-label">{{ t('Subchapter') }}</label>
        <div class="dropdown searchable-single-select" id="editSubchapterDropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate" type="button" 
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span id="editSubchapterLabel">{{ t('None') }}</span>
            </button>
            <div class="dropdown-menu w-100 p-2">
                <div class="input-group input-group-sm mb-2">
                    <input type="text" class="form-control" id="editSubchapterSearch" placeholder="{{ t('Search subchapters...') }}">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearEditSubchapterSearch()">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div id="editSubchapterOptions" class="searchable-options-list" style="max-height: 200px; overflow-y: auto;">
                    <div class="searchable-option" data-value="" onclick="selectEditSubchapter('', '')">{{ t('None') }}</div>
                </div>
            </div>
        </div>
        <input type="hidden" id="editSubchapter" name="subchapter_id" value="">
        <small class="text-muted">{{ t('Select chapter first to see subchapters (all shown including hidden)') }}</small>
    </div>
</div>
