{#
   Shared Tag Editor JavaScript Functions
   Include this inside a <script> block. Works with partials/tag_editor_form.html.
   
   Provides:
     - loadTopicsForEditForm(subjectId) — fetches topics and renders searchable dropdowns
     - loadEditChapters(subjectId, selectedChapterId, selectedSubchapterId)
     - populateTagForm(questionData) — one-call form population
     - All searchable dropdown filter/select/clear helpers
   
   Does NOT provide (page-specific):
     - saveQuestionTags()
     
   Requires these Jinja2 URL endpoints to be available:
     - dashboard.get_topics, dashboard.get_subtopics, dashboard.get_subchapters, dashboard.get_chapters
#}

// ==================== TAG EDITOR: TOPIC LOADING ====================

function loadTopicsForEditForm(subjectId) {
    fetch(`{{ url_for('dashboard.get_topics', subject_id='__SUBJECT_ID__') }}`.replace('__SUBJECT_ID__', subjectId))
        .then(r => r.json())
        .then(topics => {
            window.editTopicsList = topics;
            
            // Render Major Topic searchable dropdown
            const majorOptionsDiv = document.getElementById('editMajorTopicOptions');
            majorOptionsDiv.innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditMajorTopic(\'\', \'None\')">None</div>' +
                topics.map(t => `<div class="searchable-option" data-value="${t.id}" data-name="${t.name.toLowerCase()}" onclick="selectEditMajorTopic('${t.id}', '${t.name.replace(/'/g, "\\'")}')">${t.name}</div>`).join('');
            
            // Render Minor Topics multi-select checkboxes
            const minorCheckboxesDiv = document.getElementById('editMinorTopicsCheckboxes');
            minorCheckboxesDiv.innerHTML = topics.map(t => `
                <div class="form-check" data-topic-name="${t.name.toLowerCase()}">
                    <input class="form-check-input edit-minor-topic-checkbox" type="checkbox" 
                           value="${t.id}" id="editMinorTopic${t.id}" onchange="onEditMinorTopicsChange()">
                    <label class="form-check-label" for="editMinorTopic${t.id}">${t.name}</label>
                </div>
            `).join('');
            
            // Update hidden select with all options
            const minorSelect = document.getElementById('editMinorTopics');
            minorSelect.innerHTML = topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            
            // Setup search listeners
            setupEditTopicSearchListeners();
        });
}

// ==================== TAG EDITOR: SEARCH LISTENERS ====================

function setupEditTopicSearchListeners() {
    const majorSearch = document.getElementById('editMajorTopicSearch');
    if (majorSearch) {
        majorSearch.removeEventListener('input', filterEditMajorTopics);
        majorSearch.addEventListener('input', filterEditMajorTopics);
    }
    const minorSearch = document.getElementById('editMinorTopicsSearch');
    if (minorSearch) {
        minorSearch.removeEventListener('input', filterEditMinorTopics);
        minorSearch.addEventListener('input', filterEditMinorTopics);
    }
}

// ==================== TAG EDITOR: MAJOR TOPIC ====================

function filterEditMajorTopics() {
    const searchTerm = document.getElementById('editMajorTopicSearch').value.toLowerCase();
    const options = document.querySelectorAll('#editMajorTopicOptions .searchable-option');
    options.forEach(opt => {
        const name = opt.dataset.name || '';
        const value = opt.dataset.value;
        if (value === '' || name.includes(searchTerm)) {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
}

function clearEditMajorTopicSearch() {
    document.getElementById('editMajorTopicSearch').value = '';
    filterEditMajorTopics();
}

function selectEditMajorTopic(value, name) {
    document.getElementById('editMajorTopic').value = value;
    document.getElementById('editMajorTopicLabel').textContent = name;
    
    const dropdown = bootstrap.Dropdown.getInstance(document.querySelector('#editMajorTopicDropdown .dropdown-toggle'));
    if (dropdown) dropdown.hide();
    
    onMajorTopicChange();
}

// ==================== TAG EDITOR: MAJOR TOPIC CHANGE ====================

function onMajorTopicChange() {
    const majorTopicId = document.getElementById('editMajorTopic').value;
    
    // Clear major subtopic
    document.getElementById('editMajorSubtopicOptions').innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditMajorSubtopic(\'\', \'None\')">None</div>';
    document.getElementById('editMajorSubtopicLabel').textContent = 'None';
    document.getElementById('editMajorSubtopic').value = '';
    
    if (majorTopicId) {
        loadMajorSubtopicsSearchable(majorTopicId, null);
    }
    
    // Reload M2M subtopics
    reloadEditSubtopics();
}

function reloadEditSubtopics() {
    const majorTopicId = document.getElementById('editMajorTopic').value;
    const selectedMinorIds = Array.from(document.querySelectorAll('.edit-minor-topic-checkbox:checked')).map(cb => parseInt(cb.value));
    
    const allTopicIds = [majorTopicId, ...selectedMinorIds].filter(id => id);
    
    if (allTopicIds.length > 0) {
        const currentlySelected = Array.from(document.querySelectorAll('.edit-subtopic-checkbox:checked')).map(cb => parseInt(cb.value));
        loadSubtopicsSearchable(allTopicIds, currentlySelected);
    } else {
        document.getElementById('editSubtopicsCheckboxes').innerHTML = '';
        document.getElementById('editSubtopicsLabel').textContent = 'None selected';
    }
}

// ==================== TAG EDITOR: MAJOR SUBTOPIC ====================

function loadMajorSubtopicsSearchable(topicId, selectedSubtopicId) {
    if (!topicId) return;
    
    fetch(`{{ url_for('dashboard.get_subtopics') }}?topic_ids=${topicId}&include_hidden=1`)
        .then(r => r.json())
        .then(subtopics => {
            window.editMajorSubtopicsList = subtopics;
            
            const optionsDiv = document.getElementById('editMajorSubtopicOptions');
            optionsDiv.innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditMajorSubtopic(\'\', \'None\')">None</div>' +
                subtopics.map(s => `<div class="searchable-option ${s.hidden ? 'opacity-75' : ''}" data-value="${s.id}" data-name="${s.name.toLowerCase()}" onclick="selectEditMajorSubtopic('${s.id}', '${s.name.replace(/'/g, "\\'")}')">${s.name}${s.hidden ? ' <i class="bi bi-eye-slash text-muted"></i>' : ''}</div>`).join('');
            
            if (selectedSubtopicId) {
                const subtopic = subtopics.find(s => s.id == selectedSubtopicId);
                if (subtopic) {
                    document.getElementById('editMajorSubtopic').value = selectedSubtopicId;
                    document.getElementById('editMajorSubtopicLabel').textContent = subtopic.name;
                }
            }
            
            const searchInput = document.getElementById('editMajorSubtopicSearch');
            if (searchInput) {
                searchInput.removeEventListener('input', filterEditMajorSubtopics);
                searchInput.addEventListener('input', filterEditMajorSubtopics);
            }
        });
}

function selectEditMajorSubtopic(value, name) {
    document.getElementById('editMajorSubtopic').value = value;
    document.getElementById('editMajorSubtopicLabel').textContent = name;
    
    const dropdown = bootstrap.Dropdown.getInstance(document.querySelector('#editMajorSubtopicDropdown .dropdown-toggle'));
    if (dropdown) dropdown.hide();
}

function filterEditMajorSubtopics() {
    const searchTerm = document.getElementById('editMajorSubtopicSearch').value.toLowerCase();
    const options = document.querySelectorAll('#editMajorSubtopicOptions .searchable-option');
    options.forEach(opt => {
        const name = opt.dataset.name || '';
        const value = opt.dataset.value;
        if (value === '' || name.includes(searchTerm)) {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
}

function clearEditMajorSubtopicSearch() {
    document.getElementById('editMajorSubtopicSearch').value = '';
    filterEditMajorSubtopics();
}

// ==================== TAG EDITOR: MINOR TOPICS ====================

function onEditMinorTopicsChange() {
    updateEditMinorTopicsLabel();
    syncEditMinorTopicsSelect();
    reloadEditSubtopics();
}

function updateEditMinorTopicsLabel() {
    const checked = document.querySelectorAll('.edit-minor-topic-checkbox:checked');
    const label = document.getElementById('editMinorTopicsLabel');
    
    if (checked.length === 0) {
        label.textContent = 'None selected';
    } else if (checked.length === 1) {
        const topicName = checked[0].parentElement.querySelector('label').textContent;
        label.textContent = topicName.length > 30 ? topicName.substring(0, 30) + '...' : topicName;
    } else {
        label.innerHTML = `${checked.length} topics <span class="badge bg-primary">${checked.length}</span>`;
    }
}

function syncEditMinorTopicsSelect() {
    const minorSelect = document.getElementById('editMinorTopics');
    const checkedIds = Array.from(document.querySelectorAll('.edit-minor-topic-checkbox:checked')).map(cb => cb.value);
    
    Array.from(minorSelect.options).forEach(opt => {
        opt.selected = checkedIds.includes(opt.value);
    });
}

function filterEditMinorTopics() {
    const searchTerm = document.getElementById('editMinorTopicsSearch').value.toLowerCase();
    const items = document.querySelectorAll('#editMinorTopicsCheckboxes .form-check');
    items.forEach(item => {
        const name = item.dataset.topicName || '';
        if (name.includes(searchTerm)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
}

function clearEditMinorTopicsSearch() {
    document.getElementById('editMinorTopicsSearch').value = '';
    filterEditMinorTopics();
}

function selectAllEditMinorTopics() {
    document.querySelectorAll('#editMinorTopicsCheckboxes .form-check:not([style*="display: none"]) .edit-minor-topic-checkbox').forEach(cb => cb.checked = true);
    onEditMinorTopicsChange();
}

function clearAllEditMinorTopics() {
    document.querySelectorAll('.edit-minor-topic-checkbox').forEach(cb => cb.checked = false);
    onEditMinorTopicsChange();
}

// ==================== TAG EDITOR: SUBTOPICS (M2M) ====================

function loadSubtopicsSearchable(topicIds, selectedSubtopicIds) {
    selectedSubtopicIds = selectedSubtopicIds || [];
    const topicIdsStr = topicIds.filter(id => id).join(',');
    if (!topicIdsStr) return;
    
    fetch(`{{ url_for('dashboard.get_subtopics') }}?topic_ids=${topicIdsStr}&include_hidden=1`)
        .then(r => r.json())
        .then(subtopics => {
            const checkboxesDiv = document.getElementById('editSubtopicsCheckboxes');
            checkboxesDiv.innerHTML = subtopics.map(s => `
                <div class="form-check ${s.hidden ? 'opacity-75' : ''}" data-subtopic-name="${s.name.toLowerCase()}">
                    <input class="form-check-input edit-subtopic-checkbox" type="checkbox" 
                           value="${s.id}" id="editSubtopic${s.id}" onchange="onEditSubtopicsChange()"
                           ${selectedSubtopicIds.includes(s.id) ? 'checked' : ''}>
                    <label class="form-check-label" for="editSubtopic${s.id}">
                        ${s.name}${s.hidden ? ' <i class="bi bi-eye-slash text-muted"></i>' : ''}
                    </label>
                </div>
            `).join('');
            
            const subtopicSelect = document.getElementById('editSubtopics');
            subtopicSelect.innerHTML = subtopics.map(s => 
                `<option value="${s.id}" ${selectedSubtopicIds.includes(s.id) ? 'selected' : ''}>${s.name}</option>`
            ).join('');
            
            updateEditSubtopicsLabel();
            
            const searchInput = document.getElementById('editSubtopicsSearch');
            if (searchInput) {
                searchInput.removeEventListener('input', filterEditSubtopics);
                searchInput.addEventListener('input', filterEditSubtopics);
            }
        });
}

function onEditSubtopicsChange() {
    updateEditSubtopicsLabel();
    syncEditSubtopicsSelect();
}

function updateEditSubtopicsLabel() {
    const checked = document.querySelectorAll('.edit-subtopic-checkbox:checked');
    const label = document.getElementById('editSubtopicsLabel');
    
    if (checked.length === 0) {
        label.textContent = 'None selected';
    } else if (checked.length === 1) {
        const name = checked[0].parentElement.querySelector('label').textContent.trim();
        label.textContent = name.length > 30 ? name.substring(0, 30) + '...' : name;
    } else {
        label.innerHTML = `${checked.length} subtopics <span class="badge bg-primary">${checked.length}</span>`;
    }
}

function syncEditSubtopicsSelect() {
    const subtopicSelect = document.getElementById('editSubtopics');
    const checkedIds = Array.from(document.querySelectorAll('.edit-subtopic-checkbox:checked')).map(cb => cb.value);
    
    Array.from(subtopicSelect.options).forEach(opt => {
        opt.selected = checkedIds.includes(opt.value);
    });
}

function filterEditSubtopics() {
    const searchTerm = document.getElementById('editSubtopicsSearch').value.toLowerCase();
    const items = document.querySelectorAll('#editSubtopicsCheckboxes .form-check');
    items.forEach(item => {
        const name = item.dataset.subtopicName || '';
        if (name.includes(searchTerm)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
}

function clearEditSubtopicsSearch() {
    document.getElementById('editSubtopicsSearch').value = '';
    filterEditSubtopics();
}

function selectAllEditSubtopics() {
    document.querySelectorAll('#editSubtopicsCheckboxes .form-check:not([style*="display: none"]) .edit-subtopic-checkbox').forEach(cb => cb.checked = true);
    onEditSubtopicsChange();
}

function clearAllEditSubtopics() {
    document.querySelectorAll('.edit-subtopic-checkbox').forEach(cb => cb.checked = false);
    onEditSubtopicsChange();
}

// ==================== TAG EDITOR: CHAPTERS ====================

function loadEditChapters(subjectId, selectedChapterId, selectedSubchapterId) {
    if (!subjectId) {
        document.getElementById('editChapterOptions').innerHTML = '<div class="searchable-option" data-value="" data-name="" onclick="selectEditChapter(\'\', \'None\')">None</div>';
        document.getElementById('editChapterLabel').textContent = 'None';
        document.getElementById('editChapter').value = '';
        return;
    }
    
    fetch(`{{ url_for('dashboard.get_chapters', subject_id='__SUBJECT_ID__') }}`.replace('__SUBJECT_ID__', subjectId))
        .then(r => r.json())
        .then(chapters => {
            window.editChaptersList = chapters;
            renderEditChapterOptions(chapters, selectedChapterId);

            if (selectedChapterId) {
                loadEditSubchapters(selectedChapterId, selectedSubchapterId);
            } else {
                document.getElementById('editSubchapterOptions').innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditSubchapter(\'\', \'None\')">None</div>';
                document.getElementById('editSubchapterLabel').textContent = 'None';
                document.getElementById('editSubchapter').value = '';
            }
        });
}

function renderEditChapterOptions(chapters, selectedChapterId) {
    const optionsDiv = document.getElementById('editChapterOptions');
    
    let html = '<div class="searchable-option" data-value="" data-name="" onclick="selectEditChapter(\'\', \'None\')">None</div>';
    chapters.forEach(c => {
        const isSelected = c.id == selectedChapterId;
        html += `<div class="searchable-option ${isSelected ? 'active' : ''}" data-value="${c.id}" data-name="${c.name.toLowerCase()}" onclick="selectEditChapter('${c.id}', '${c.name.replace(/'/g, "\\'")}')">
            ${c.name}
        </div>`;
    });
    optionsDiv.innerHTML = html;
    
    document.getElementById('editChapter').value = selectedChapterId || '';
    
    if (selectedChapterId) {
        const chapter = chapters.find(c => c.id == selectedChapterId);
        document.getElementById('editChapterLabel').textContent = chapter ? chapter.name : 'None';
    } else {
        document.getElementById('editChapterLabel').textContent = 'None';
    }
    
    const searchInput = document.getElementById('editChapterSearch');
    if (searchInput) {
        searchInput.removeEventListener('input', filterEditChapters);
        searchInput.addEventListener('input', filterEditChapters);
    }
}

function selectEditChapter(chapterId, chapterName) {
    document.getElementById('editChapter').value = chapterId;
    document.getElementById('editChapterLabel').textContent = chapterName;
    
    document.querySelectorAll('#editChapterOptions .searchable-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.value === chapterId);
    });
    
    const dropdown = bootstrap.Dropdown.getInstance(document.querySelector('#editChapterDropdown .dropdown-toggle'));
    if (dropdown) dropdown.hide();
    
    document.getElementById('editSubchapter').value = '';
    document.getElementById('editSubchapterLabel').textContent = 'None';
    
    if (chapterId) {
        loadEditSubchapters(chapterId, null);
    } else {
        document.getElementById('editSubchapterOptions').innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditSubchapter(\'\', \'None\')">None</div>';
    }
}

function filterEditChapters() {
    const searchTerm = document.getElementById('editChapterSearch').value.toLowerCase();
    const options = document.querySelectorAll('#editChapterOptions .searchable-option');
    
    options.forEach(opt => {
        const name = opt.dataset.name || '';
        if (name.includes(searchTerm) || opt.dataset.value === '') {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
}

function clearEditChapterSearch() {
    document.getElementById('editChapterSearch').value = '';
    filterEditChapters();
}

// ==================== TAG EDITOR: SUBCHAPTERS ====================

function loadEditSubchapters(chapterId, selectedSubchapterId) {
    fetch(`{{ url_for('dashboard.get_subchapters') }}?chapter_ids=${chapterId}&include_hidden=1`)
        .then(r => r.json())
        .then(subchapters => {
            window.editSubchaptersList = subchapters;
            renderEditSubchapterOptions(subchapters, selectedSubchapterId);
        });
}

function renderEditSubchapterOptions(subchapters, selectedSubchapterId) {
    const optionsDiv = document.getElementById('editSubchapterOptions');
    
    let html = '<div class="searchable-option" data-value="" data-name="" onclick="selectEditSubchapter(\'\', \'None\')">None</div>';
    subchapters.forEach(sc => {
        const isSelected = sc.id == selectedSubchapterId;
        const hiddenIndicator = sc.hidden ? ' <i class="bi bi-eye-slash text-muted"></i>' : '';
        html += `<div class="searchable-option ${isSelected ? 'active' : ''}" data-value="${sc.id}" data-name="${sc.name.toLowerCase()}" onclick="selectEditSubchapter('${sc.id}', '${sc.name.replace(/'/g, "\\'")}')">
            ${sc.name}${hiddenIndicator}
        </div>`;
    });
    optionsDiv.innerHTML = html;
    
    document.getElementById('editSubchapter').value = selectedSubchapterId || '';
    
    if (selectedSubchapterId) {
        const subchapter = subchapters.find(sc => sc.id == selectedSubchapterId);
        document.getElementById('editSubchapterLabel').textContent = subchapter ? subchapter.name : 'None';
    } else {
        document.getElementById('editSubchapterLabel').textContent = 'None';
    }
    
    const searchInput = document.getElementById('editSubchapterSearch');
    if (searchInput) {
        searchInput.removeEventListener('input', filterEditSubchaptersModal);
        searchInput.addEventListener('input', filterEditSubchaptersModal);
    }
}

function selectEditSubchapter(subchapterId, subchapterName) {
    document.getElementById('editSubchapter').value = subchapterId;
    document.getElementById('editSubchapterLabel').textContent = subchapterName;
    
    document.querySelectorAll('#editSubchapterOptions .searchable-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.value === subchapterId);
    });
    
    const dropdown = bootstrap.Dropdown.getInstance(document.querySelector('#editSubchapterDropdown .dropdown-toggle'));
    if (dropdown) dropdown.hide();
}

function filterEditSubchaptersModal() {
    const searchTerm = document.getElementById('editSubchapterSearch').value.toLowerCase();
    const options = document.querySelectorAll('#editSubchapterOptions .searchable-option');
    
    options.forEach(opt => {
        const name = opt.dataset.name || '';
        if (name.includes(searchTerm) || opt.dataset.value === '') {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
}

function clearEditSubchapterSearch() {
    document.getElementById('editSubchapterSearch').value = '';
    filterEditSubchaptersModal();
}

// ==================== TAG EDITOR: POPULATE FORM ====================

/**
 * Populate the shared tag editor form with question data.
 * Call this when opening an edit modal for a question.
 * @param {Object} questionData - question data including level, q_type, section, major_topic_id, etc.
 */
function populateTagForm(questionData) {
    // Set simple field values
    document.getElementById('editLevel').value = questionData.level !== null && questionData.level !== undefined ? questionData.level : '';
    document.getElementById('editQType').value = questionData.q_type || '';
    document.getElementById('editSection').value = questionData.section || '';
    document.getElementById('editDescription').value = questionData.description || '';
    document.getElementById('editCorrectPercentage').value = questionData.correct_percentage !== null && questionData.correct_percentage !== undefined ? questionData.correct_percentage : '';
    document.getElementById('editAnswer').value = questionData.answer || '';
    document.getElementById('editComment').value = questionData.comment || '';
    const answerAiBtns = document.getElementById('editAnswerAiBtns');
    if (answerAiBtns) answerAiBtns.classList.toggle('d-none', !window.OQB_AI_TOOLS_ENABLED);
    const answerAiStatus = document.getElementById('editAnswerAiStatus');
    if (answerAiStatus) answerAiStatus.textContent = '';

    // Reset search fields
    ['editMajorTopicSearch', 'editMinorTopicsSearch', 'editMajorSubtopicSearch',
     'editSubtopicsSearch', 'editChapterSearch', 'editSubchapterSearch'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });

    // Load topics for this subject
    loadTopicsForEditForm(questionData.subject);

    // Load chapters
    loadEditChapters(questionData.subject, questionData.chapter_id, questionData.subchapter_id);

    // Set topic/subtopic selections after async load
    setTimeout(() => {
        // Major topic
        const majorTopicId = questionData.major_topic_id || '';
        document.getElementById('editMajorTopic').value = majorTopicId;

        if (majorTopicId && window.editTopicsList) {
            const topic = window.editTopicsList.find(t => t.id == majorTopicId);
            document.getElementById('editMajorTopicLabel').textContent = topic ? topic.name : 'None';
        } else {
            document.getElementById('editMajorTopicLabel').textContent = 'None';
        }

        // Major subtopic
        if (questionData.major_topic_id) {
            loadMajorSubtopicsSearchable(questionData.major_topic_id, questionData.major_subtopic_id);
        } else {
            document.getElementById('editMajorSubtopicOptions').innerHTML = '<div class="searchable-option" data-value="" onclick="selectEditMajorSubtopic(\'\', \'None\')">None</div>';
            document.getElementById('editMajorSubtopicLabel').textContent = 'None';
            document.getElementById('editMajorSubtopic').value = '';
        }

        // Minor topics checkboxes
        document.querySelectorAll('.edit-minor-topic-checkbox').forEach(cb => {
            cb.checked = (questionData.minor_topic_ids || []).includes(parseInt(cb.value));
        });
        updateEditMinorTopicsLabel();
        syncEditMinorTopicsSelect();

        // Subtopics (from major + minor topics)
        if (questionData.major_topic_id || (questionData.minor_topic_ids && questionData.minor_topic_ids.length > 0)) {
            const allTopicIds = [questionData.major_topic_id, ...(questionData.minor_topic_ids || [])].filter(id => id);
            loadSubtopicsSearchable(allTopicIds, questionData.subtopic_ids || []);
        } else {
            document.getElementById('editSubtopicsCheckboxes').innerHTML = '';
            document.getElementById('editSubtopicsLabel').textContent = 'None selected';
        }
    }, 500);
}
