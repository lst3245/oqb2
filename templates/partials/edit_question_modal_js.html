{#
   Shared Question Edit Modal — JavaScript.

   Pair partial for partials/edit_question_modal.html. Include this ONCE per
   page, inside the page's <script> block (typically extra_js).

   Each host page should set its refresh callback after include:

       window.oqbAfterQuestionEdit = loadQuestions;       // admin
       window.oqbAfterQuestionEdit = refreshCurrentPage;  // dashboard

   This partial brings its own tag editor JS (partials/tag_editor_js.html) —
   do NOT include tag_editor_js.html separately on the host page or
   populateTagForm / loadTopicsForEditForm will be re-declared.
#}

// ==================== SHARED TAG EDITOR FUNCTIONS ====================
{% include 'partials/tag_editor_js.html' %}

// ==================== TOAST (idempotent — only define if missing) ====================
if (typeof window.showToast !== 'function') {
    window.showToast = function(message, type) {
        type = type || 'success';
        const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const bgClass = type === 'success' ? 'bg-success'
            : type === 'danger' ? 'bg-danger'
            : type === 'warning' ? 'bg-warning text-dark'
            : 'bg-info';
        const html = `<div id="${id}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
            <div class="d-flex"><div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
        const container = document.getElementById('toastContainer');
        if (!container) { console.log('[toast]', message); return; }
        container.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        const t = new bootstrap.Toast(el, {delay: 4000});
        t.show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    };
}
// Local alias used throughout this partial.
const showToast = window.showToast;

// ==================== STATE ====================
let editQuestionData = null;     // current question being edited
let currentAssetLang = 'EN';
// Set when Assets-tab work changes list columns (counts / proofread / verified).
let _editModalListStale = false;

function markEditModalListStale() {
    _editModalListStale = true;
}

/** Immediate refresh of the host list (admin table or dashboard cards). */
function refreshOuterQuestionList() {
    _editModalListStale = false;
    if (typeof window.oqbAfterQuestionEdit === 'function') {
        window.oqbAfterQuestionEdit();
    }
}

function flushEditModalListRefresh() {
    if (!_editModalListStale) return;
    refreshOuterQuestionList();
}
let allTopicsCache = window.allTopicsCache || {};        // subjectId -> topics[]
let allChaptersCache = window.allChaptersCache || {};    // subjectId -> chapters[]
window.allTopicsCache = allTopicsCache;
window.allChaptersCache = allChaptersCache;

// Active paste targets (lang + atype + ctx). 'add' ctx is only used by
// admin_questions.html's Add wizard, but we keep the variable here so the
// shared paste listener can reference it without ReferenceError.
let activePasteTarget = { lang: 'EN', atype: 'QUE', ctx: 'edit' };
window.addActivePasteTarget = window.addActivePasteTarget || { lang: 'EN', atype: 'QUE', ctx: 'add' };

// ==================== ASSET PREVIEW SIZE TOGGLE ====================
// Controls `<body>.asset-thumbs-compact`. When ON (default), IMG parts render as a
// small thumbnail grid; when OFF, current full-width vertically-stacked behaviour.
// Persisted in localStorage so the choice survives page reloads, and applied via
// <body> class so both the edit modal AND the admin Add-question wizard inherit it.
const OQB_THUMB_COMPACT_KEY = 'oqb_assetThumbsCompact';
function oqbIsThumbsCompact() {
    const raw = localStorage.getItem(OQB_THUMB_COMPACT_KEY);
    return raw === null ? true : raw === '1';
}
function oqbApplyThumbCompact(compact) {
    document.body.classList.toggle('asset-thumbs-compact', !!compact);
    const cb = document.getElementById('editAssetCompactToggle');
    if (cb) cb.checked = !!compact;
}
function oqbInitThumbCompact() {
    oqbApplyThumbCompact(oqbIsThumbsCompact());
    const cb = document.getElementById('editAssetCompactToggle');
    if (cb && !cb.dataset.oqbBound) {
        cb.dataset.oqbBound = '1';
        cb.addEventListener('change', function() {
            localStorage.setItem(OQB_THUMB_COMPACT_KEY, cb.checked ? '1' : '0');
            oqbApplyThumbCompact(cb.checked);
        });
    }
}
document.addEventListener('DOMContentLoaded', oqbInitThumbCompact);
// Idempotently re-apply on first script run (in case DOMContentLoaded already fired,
// e.g. when this partial loads later than the body parse).
oqbInitThumbCompact();

// ==================== EDIT MODAL NAVIGATION (Prev / Next) ====================
//
// Host pages provide the ordered list of question IDs to navigate either by
// calling window.oqbSetEditNavList([...]) or by defining a function
// window.oqbEditNavSource() that returns the current ordered ID array (read
// fresh every time the modal opens). The dashboard uses the full filtered set
// (#allQuestionIds across all pages); the admin list uses the current page's
// rows.
window.oqbEditNav = window.oqbEditNav || { ids: [], idx: -1 };

window.oqbSetEditNavList = function(ids) {
    window.oqbEditNav.ids = (ids || []).map(Number).filter(n => !isNaN(n));
};

function _oqbRefreshEditNavList() {
    if (typeof window.oqbEditNavSource === 'function') {
        try { window.oqbSetEditNavList(window.oqbEditNavSource()); } catch (e) { /* ignore */ }
    }
}

function _oqbUpdateEditNavUI(currentId) {
    const ctrls = document.getElementById('editNavControls');
    if (!ctrls) return;
    const nav = window.oqbEditNav;
    nav.idx = nav.ids.indexOf(Number(currentId));
    if (nav.ids.length <= 1 || nav.idx === -1) {
        ctrls.classList.add('d-none');
        ctrls.classList.remove('d-flex');
        return;
    }
    ctrls.classList.remove('d-none');
    ctrls.classList.add('d-flex');
    document.getElementById('editNavPos').textContent = `${nav.idx + 1} / ${nav.ids.length}`;
    document.getElementById('editNavPrev').disabled = nav.idx <= 0;
    document.getElementById('editNavNext').disabled = nav.idx >= nav.ids.length - 1;
}

function oqbEditNavGo(delta) {
    const nav = window.oqbEditNav;
    if (nav.idx === -1) return;
    const target = nav.idx + delta;
    if (target < 0 || target >= nav.ids.length) return;
    // Preserve the currently active main tab + version pill across navigation.
    openEditModal(nav.ids[target], { preserveView: true });
}

// ==================== EDIT MODAL ====================
function openEditModal(questionId, opts) {
    opts = opts || {};
    const preserve = !!opts.preserveView;
    if (!preserve) {
        _editModalListStale = false;
    }

    // When preserving, remember which main tab + version pill is active so we
    // can re-activate the same view after the new question's data loads.
    let keepTab = null, keepLang = null;
    if (preserve) {
        const at = document.querySelector('#editQuestionModal .nav-tabs .nav-link.active');
        keepTab = at ? at.getAttribute('href') : null;
        const al = document.querySelector('#langTabs .nav-link.active');
        keepLang = al ? al.getAttribute('href') : null;
    }

    editQuestionData = null;
    currentAssetLang = (preserve && keepLang) ? keepLang.replace('#lang', '') : 'EN';
    oqbInitThumbCompact();

    if (!preserve) {
        // Reset tabs to first (Tags is the default tab)
        document.querySelector('#editQuestionModal .nav-link.active')?.classList.remove('active');
        document.querySelector('#editQuestionModal .tab-pane.active')?.classList.remove('show', 'active');
        document.querySelector('#editQuestionModal [href="#tabTags"]').classList.add('active');
        document.getElementById('tabTags').classList.add('show', 'active');
        // Reset lang pills
        document.querySelectorAll('#langTabs .nav-link').forEach(l => l.classList.remove('active'));
        document.querySelector('#langTabs [href="#langEN"]').classList.add('active');
        document.querySelectorAll('#tabAssets .tab-pane').forEach(p => { p.classList.remove('show','active'); p.innerHTML = ''; });
        document.getElementById('langEN').classList.add('show','active');
    } else {
        // Keep active tab/pill markup; just clear stale asset pane contents.
        document.querySelectorAll('#tabAssets .tab-pane').forEach(p => { p.innerHTML = ''; });
    }

    document.getElementById('renameStatus').innerHTML = '';

    // Refresh the navigation list (host-provided) and update the Prev/Next UI.
    _oqbRefreshEditNavList();
    _oqbUpdateEditNavUI(questionId);

    // Load question details
    fetch(`{{ url_for('admin.question_details', question_id=0) }}`.replace('/0/', `/${questionId}/`))
        .then(r => r.json())
        .then(data => {
            editQuestionData = data;
            document.getElementById('editQId').value = data.id;
            document.getElementById('editQidTitle').textContent = data.qid;
            document.getElementById('editQidInput').value = data.qid;
            document.getElementById('editCreatedAt').value = window.oqbFormatLocalTime(data.created_at);

            // Use shared populateTagForm to fill in tag fields
            populateTagForm(data);

            // Auto Tag button is admin-only + gated on AI Tools being enabled.
            const atBtn = document.getElementById('autoTagBtn');
            if (atBtn) atBtn.style.display = window.OQB_AI_TOOLS_ENABLED ? '' : 'none';

            // Whole-question verified state (Details tab).
            setVerifiedUI(data.verified,
                data.verified_at ? window.oqbFormatLocalTime(data.verified_at) : null,
                data.verified_by);

            // Load assets (deferred — Assets tab is hidden until user clicks)
            loadAssetsForEdit(data.id);

            bootstrap.Modal.getOrCreateInstance(document.getElementById('editQuestionModal')).show();
            _oqbUpdateEditNavUI(data.id);
        })
        .catch(err => showToast('Error loading question: ' + err.message, 'danger'));
}

// ==================== TAG FORM HELPERS (caching for add-question flow) ====================
function fetchTopicsForSubject(subjectId) {
    if (allTopicsCache[subjectId]) {
        return Promise.resolve(allTopicsCache[subjectId]);
    }
    return fetch(`{{ url_for('dashboard.get_topics', subject_id='__SID__') }}`.replace('__SID__', subjectId))
        .then(r => r.json())
        .then(topics => {
            allTopicsCache[subjectId] = topics;
            return topics;
        });
}

function fetchChaptersForSubject(subjectId) {
    if (allChaptersCache[subjectId]) {
        return Promise.resolve(allChaptersCache[subjectId]);
    }
    return fetch(`{{ url_for('dashboard.get_chapters', subject_id='__SID__') }}`.replace('__SID__', subjectId))
        .then(r => r.json())
        .then(chapters => {
            allChaptersCache[subjectId] = chapters;
            return chapters;
        });
}

function saveQuestionTags() {
    const qId = document.getElementById('editQId').value;
    const formData = new FormData(document.getElementById('editForm'));

    fetch(`{{ url_for('admin.update_question', question_id=0) }}`.replace('/0/', `/${qId}/`), {
        method: 'POST',
        body: formData
    })
    .then(r => {
        if (!r.ok) {
            return r.json().then(err => { throw new Error(err.error || 'Error updating question'); });
        }
        return r.json();
    })
    .then(data => {
        if (data.success) {
            showToast('Tags saved successfully');
            refreshOuterQuestionList();
        } else {
            throw new Error(data.error || 'Error saving tags');
        }
    })
    .catch(err => showToast(err.message || 'Error saving tags', 'danger'));
}

// ==================== VERIFY (whole-question flag) ====================
function setVerifiedUI(verified, verifiedAt, verifiedBy) {
    const toggle = document.getElementById('editVerifiedToggle');
    const badge = document.getElementById('editVerifiedBadge');
    const meta = document.getElementById('editVerifiedMeta');
    if (toggle) toggle.checked = !!verified;
    if (badge) {
        badge.className = 'badge ' + (verified ? 'bg-success' : 'bg-secondary');
        badge.innerHTML = verified
            ? '<i class="bi bi-patch-check-fill"></i> Verified'
            : '<i class="bi bi-shield"></i> Not verified';
    }
    if (meta) {
        meta.textContent = (verified && verifiedAt)
            ? `Verified ${verifiedAt}${verifiedBy ? ' by ' + verifiedBy : ''}` : '';
    }
}

function onEditVerifiedToggle() {
    if (!editQuestionData) return;
    const toggle = document.getElementById('editVerifiedToggle');
    const want = toggle.checked;

    // Soft-warn when verifying a question whose assets aren't all checked-OK.
    if (want) {
        const notOk = editQuestionData._assetNotOk || 0;
        const total = editQuestionData._assetTotal || 0;
        if (total === 0) {
            if (!confirm('This question has no assets. Mark it verified anyway?')) {
                toggle.checked = false; return;
            }
        } else if (notOk > 0) {
            if (!confirm(`${notOk} of ${total} asset(s) are not marked checked-OK. Mark the question verified anyway?`)) {
                toggle.checked = false; return;
            }
        }
    }

    const url = `{{ url_for('admin.set_question_verified', question_id=0) }}`.replace('/questions/0/', `/questions/${editQuestionData.id}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ verified: want })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
        if (ok && d.success) {
            editQuestionData.verified = d.verified;
            editQuestionData.verified_at = d.verified_at;
            setVerifiedUI(d.verified, d.verified_at ? window.oqbFormatLocalTime(d.verified_at) : null, null);
            showToast(d.verified ? 'Marked verified' : 'Verification cleared', d.verified ? 'success' : 'info');
            refreshOuterQuestionList();
        } else {
            toggle.checked = !want;  // revert on failure
            showToast((d && (d.error || d.message)) || 'Could not update verification', 'danger');
        }
    })
    .catch(err => { toggle.checked = !want; showToast('Error: ' + err.message, 'danger'); });
}

// ==================== AUTO TAG (single-question, review-before-save) ====================
let _autoTagModalInstance = null;

function openAutoTagModal() {
    if (!editQuestionData) return;
    const modalEl = document.getElementById('autoTagModal');
    if (!modalEl) return;

    document.getElementById('autoTagStatus').innerHTML = '';
    const runBtn = document.getElementById('autoTagRunBtn');
    runBtn.disabled = false;
    runBtn.innerHTML = '<i class="bi bi-robot"></i> Suggest tags';

    // Default version selection: versions that actually have assets, else EN.
    const present = (editQuestionData._presentVersions && editQuestionData._presentVersions.length)
        ? editQuestionData._presentVersions : ['EN'];
    document.querySelectorAll('.autotag-version').forEach(cb => {
        cb.checked = present.includes(cb.value);
    });

    // Populate endpoints (vision-capable preferred).
    const sel = document.getElementById('autoTagEndpoint');
    sel.innerHTML = '<option value="">Loading…</option>';
    fetch(`{{ url_for('admin.ai_endpoints') }}`)
        .then(r => r.json())
        .then(data => {
            const eps = data.endpoints || [];
            if (!eps.length) { sel.innerHTML = '<option value="">No endpoints configured</option>'; return; }
            sel.innerHTML = eps.map(ep => {
                const vis = ep.supports_vision ? '' : ' (text-only — not usable)';
                return `<option value="${ep.id}"${ep.supports_vision ? '' : ' disabled'}>${_aiEscapeAttr(ep.name)} — ${_aiEscapeAttr(ep.model_name)}${vis}</option>`;
            }).join('');
            const id = _aiPickDefaultEndpointId(eps, data.defaults, 'tag');
            if (id != null) sel.value = String(id);
        })
        .catch(() => { sel.innerHTML = '<option value="">Failed to load endpoints</option>'; });

    if (!_autoTagModalInstance) {
        _autoTagModalInstance = new bootstrap.Modal(modalEl);
        modalEl.addEventListener('hidden.bs.modal', () => {
            // Restore the parent edit modal's scroll lock (stacked modal).
            const editModal = document.getElementById('editQuestionModal');
            if (editModal && editModal.classList.contains('show')) {
                document.body.classList.add('modal-open');
            }
        });
    }
    _autoTagModalInstance.show();
}

function runAutoTag() {
    if (!editQuestionData) return;
    const endpointId = document.getElementById('autoTagEndpoint').value;
    if (!endpointId) { showToast('Select a vision-capable endpoint first.', 'warning'); return; }
    const fields = Array.from(document.querySelectorAll('.autotag-field:checked')).map(cb => cb.value);
    if (!fields.length) { showToast('Pick at least one tag field.', 'warning'); return; }
    const versions = Array.from(document.querySelectorAll('.autotag-version:checked')).map(cb => cb.value);
    if (!versions.length) { showToast('Pick at least one version to send.', 'warning'); return; }
    const overwrite = document.getElementById('autoTagOverwrite').checked;

    const runBtn = document.getElementById('autoTagRunBtn');
    const status = document.getElementById('autoTagStatus');
    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Thinking…';
    status.innerHTML = '<span class="text-muted">Calling the model — this can take a while…</span>';

    const url = `{{ url_for('admin.ai_suggest_tags', question_id=0) }}`.replace('/questions/0/', `/questions/${editQuestionData.id}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ endpoint_id: parseInt(endpointId, 10), fields: fields, versions: versions })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
        runBtn.disabled = false;
        runBtn.innerHTML = '<i class="bi bi-robot"></i> Suggest tags';
        if (!ok || !d.success) {
            status.innerHTML = `<span class="text-danger">${_aiEscapeAttr((d && (d.error || d.message)) || 'No suggestion')}</span>`;
            return;
        }
        const changed = applySuggestionsToForm(d.suggestions || {}, d.fields || fields, overwrite);
        let summary = `<span class="text-success"><i class="bi bi-check-circle"></i> Populated ${changed.length} field(s) — review and click <strong>Save Tags</strong>.</span>`;
        const unmatched = d.unmatched || [];
        if (unmatched.length) {
            summary += `<div class="mt-1 text-warning"><i class="bi bi-exclamation-triangle"></i> Could not match: ${unmatched.map(u => _aiEscapeAttr(u.name)).join(', ')}</div>`;
        }
        status.innerHTML = summary;
        showToast(`Auto Tag populated ${changed.length} field(s)`, 'success');
        setTimeout(() => { if (_autoTagModalInstance) _autoTagModalInstance.hide(); }, unmatched.length ? 1800 : 600);
    })
    .catch(err => {
        runBtn.disabled = false;
        runBtn.innerHTML = '<i class="bi bi-robot"></i> Suggest tags';
        status.innerHTML = `<span class="text-danger">Network error: ${_aiEscapeAttr(err.message)}</span>`;
    });
}

// Snapshot the current tag-form state as a populateTagForm-shaped object.
function readCurrentTagFormState() {
    const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const intOrNull = s => (s && s !== '' ? parseInt(s, 10) : null);
    return {
        subject: editQuestionData ? editQuestionData.subject : '',
        level: v('editLevel') === '' ? null : parseInt(v('editLevel'), 10),
        q_type: v('editQType') || null,
        section: v('editSection') || null,
        description: v('editDescription') || null,
        correct_percentage: v('editCorrectPercentage') === '' ? null : parseInt(v('editCorrectPercentage'), 10),
        answer: v('editAnswer') || null,
        comment: v('editComment') || null,
        major_topic_id: intOrNull(v('editMajorTopic')),
        major_subtopic_id: intOrNull(v('editMajorSubtopic')),
        minor_topic_ids: Array.from(document.querySelectorAll('.edit-minor-topic-checkbox:checked')).map(cb => parseInt(cb.value)),
        subtopic_ids: Array.from(document.querySelectorAll('.edit-subtopic-checkbox:checked')).map(cb => parseInt(cb.value)),
        chapter_id: intOrNull(v('editChapter')),
        subchapter_id: intOrNull(v('editSubchapter')),
    };
}

// Merge LLM suggestions into the current form (respecting overwrite), re-run
// populateTagForm, switch to the Tags tab, and briefly highlight changed
// fields. Returns the list of field keys actually set.
function applySuggestionsToForm(suggestions, fields, overwrite) {
    const cur = readCurrentTagFormState();
    const merged = Object.assign({}, cur);
    const fieldSet = new Set(fields);
    const changed = [];

    function setIf(fieldKey, dataKey, value, isEmpty) {
        if (!fieldSet.has(fieldKey)) return;
        if (value === undefined || value === null) return;
        if (Array.isArray(value) && value.length === 0) return;
        if (!overwrite && !isEmpty) return;
        merged[dataKey] = value;
        changed.push(fieldKey);
    }

    setIf('q_type', 'q_type', suggestions.q_type, !cur.q_type);
    setIf('level', 'level', suggestions.level, cur.level === null || cur.level === undefined);
    setIf('section', 'section', suggestions.section, !cur.section);
    setIf('major_topic', 'major_topic_id', suggestions.major_topic_id, cur.major_topic_id === null);
    setIf('major_subtopic', 'major_subtopic_id', suggestions.major_subtopic_id, cur.major_subtopic_id === null);
    setIf('minor_topics', 'minor_topic_ids', suggestions.minor_topic_ids, (cur.minor_topic_ids || []).length === 0);
    setIf('subtopics', 'subtopic_ids', suggestions.subtopic_ids, (cur.subtopic_ids || []).length === 0);
    setIf('chapter', 'chapter_id', suggestions.chapter_id, cur.chapter_id === null);
    setIf('subchapter', 'subchapter_id', suggestions.subchapter_id, cur.subchapter_id === null);

    populateTagForm(merged);

    // Switch to the Tags tab so the populated fields are visible.
    const tagsTabLink = document.querySelector('#editQuestionModal [href="#tabTags"]');
    if (tagsTabLink) { try { new bootstrap.Tab(tagsTabLink).show(); } catch (e) {} }

    // Highlight changed fields after populateTagForm's async dropdown rebuild.
    setTimeout(() => _highlightSuggestedFields(changed), 650);
    return changed;
}

function _highlightSuggestedFields(fields) {
    const map = {
        q_type: '#editQType', level: '#editLevel', section: '#editSection',
        major_topic: '#editMajorTopicDropdown .dropdown-toggle',
        major_subtopic: '#editMajorSubtopicDropdown .dropdown-toggle',
        minor_topics: '#editMinorTopicsDropdown .dropdown-toggle',
        subtopics: '#editSubtopicsDropdown .dropdown-toggle',
        chapter: '#editChapterDropdown .dropdown-toggle',
        subchapter: '#editSubchapterDropdown .dropdown-toggle',
    };
    (fields || []).forEach(f => {
        const el = document.querySelector(map[f]);
        if (!el) return;
        el.classList.add('oqb-tag-suggested');
        setTimeout(() => el.classList.remove('oqb-tag-suggested'), 2500);
    });
}

// ==================== RENAME ====================
let pendingRenameNewQid = '';

function renameQuestion() {
    const newQid = document.getElementById('editQidInput').value.trim();
    const oldQid = editQuestionData.qid;
    if (!newQid) return;
    if (newQid === oldQid) { showToast('QID unchanged', 'info'); return; }

    pendingRenameNewQid = newQid;
    document.getElementById('renameOldQid').textContent = oldQid;
    document.getElementById('renameNewQid').textContent = newQid;
    document.getElementById('renameFilesCheck').checked = true;
    new bootstrap.Modal(document.getElementById('renameConfirmModal')).show();
}

function executeRename() {
    const qId = editQuestionData.id;
    const renameFiles = document.getElementById('renameFilesCheck').checked;

    fetch(`{{ url_for('admin.rename_question', question_id=0) }}`.replace('/0/', `/${qId}/`), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ new_qid: pendingRenameNewQid, confirm_rename_files: renameFiles })
    })
    .then(r => r.json())
    .then(data => {
        bootstrap.Modal.getInstance(document.getElementById('renameConfirmModal')).hide();
        if (data.success) {
            showToast(data.message);
            editQuestionData.qid = data.new_qid;
            document.getElementById('editQidTitle').textContent = data.new_qid;
            document.getElementById('renameStatus').innerHTML = `<div class="alert alert-success py-1">${data.message}</div>`;
            loadAssetsForEdit(qId);
            refreshOuterQuestionList();
        } else {
            document.getElementById('renameStatus').innerHTML = `<div class="alert alert-danger py-1">${data.error}</div>`;
        }
    })
    .catch(err => {
        bootstrap.Modal.getInstance(document.getElementById('renameConfirmModal'))?.hide();
        document.getElementById('renameStatus').innerHTML = `<div class="alert alert-danger py-1">Error: ${err.message}</div>`;
    });
}

// ==================== ASSET MANAGEMENT ====================
function switchAssetLang(lang) {
    currentAssetLang = lang;
    // Reset paste target to QUE for the new language (edit modal)
    setActivePasteTarget(lang, 'QUE', 'edit');
}

function loadAssetsForEdit(questionId) {
    fetch(`{{ url_for('admin.question_assets', question_id=0) }}`.replace('/0/', `/${questionId}/`))
        .then(r => r.json())
        .then(data => {
            // Cache full per-version asset tree before rendering any tab so
            // aiSlotMdButtonHtml can see IMG on other versions (ENO, etc.).
            window._oqbQuestionAssets = window._oqbQuestionAssets || {};
            window._oqbQuestionAssets[questionId] = data.assets || {};
            if (editQuestionData) {
                editQuestionData._assets = data.assets || {};
            }

            (window.OQB_VERSIONS || ['EN', 'CH', 'BI']).forEach(lang => {
                const container = document.getElementById('lang' + lang);
                if (!container) return;
                container.innerHTML = renderAssetSections(questionId, lang, data.assets[lang] || {}, 'edit');
            });

            // Roll up asset check states (for the verify soft-warn) and record
            // which versions actually have assets (Auto Tag default versions).
            let notOk = 0, totalA = 0;
            const present = [];
            Object.keys(data.assets || {}).forEach(ver => {
                const byType = data.assets[ver] || {};
                let verHas = false;
                Object.keys(byType).forEach(at => {
                    (byType[at] || []).forEach(p => {
                        totalA++; verHas = true;
                        if ((p.check_state || null) !== 'ok') notOk++;
                    });
                });
                if (verHas) present.push(ver);
            });
            if (editQuestionData) {
                editQuestionData._assetNotOk = notOk;
                editQuestionData._assetTotal = totalA;
                editQuestionData._presentVersions = present;
            }

            // Re-render always paints QUE as the visual default. Override it so the user's
            // chosen paste target (e.g. SOL) survives an upload → refresh round-trip.
            setActivePasteTarget(activePasteTarget.lang, activePasteTarget.atype, 'edit');
        })
        .catch(err => showToast('Error loading assets: ' + err.message, 'danger'));
}

// ctx = 'edit' or 'add' to avoid duplicate IDs when both modals exist in the DOM
// AI Tools proofreading badge. Reads check_state from the given part(s).
function _aiEscapeAttr(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Pick the right value to pre-select for an AI endpoint dropdown given the
// per-feature defaults map returned by /admin/questions/ai/endpoints. Falls
// back to the first vision-capable endpoint when the configured default is
// missing or disabled (e.g. its row was deleted).
function _aiPickDefaultEndpointId(eps, defaults, opKey) {
    const want = (defaults || {})[opKey];
    if (want != null) {
        const cfg = (eps || []).find(ep => ep.id === want);
        if (cfg && cfg.supports_vision) return cfg.id;
    }
    const fv = (eps || []).find(ep => ep.supports_vision);
    return fv ? fv.id : null;
}

function _checkStatePriority(st) {
    const order = { issues: 0, error: 1, checking: 2, ok: 4 };
    return order[st] ?? 3;
}

function _worstCheckPart(parts) {
    const withState = (parts || []).filter(p => p.check_state);
    if (!withState.length) return null;
    return withState.sort((a, b) =>
        _checkStatePriority(a.check_state) - _checkStatePriority(b.check_state))[0];
}

function renderCheckBadge(parts) {
    const checked = _worstCheckPart(parts);
    if (!checked) return '';
    const st = checked.check_state;
    const res = checked.check_result || {};
    const when = checked.checked_at ? window.oqbFormatLocalTime(checked.checked_at) : '';
    const ref = res.ref_version ? ` vs ${res.ref_version}` : '';
    if (st === 'ok') {
        return `<span class="badge bg-success ms-2" title="Proofread OK${ref}${when ? ' · ' + when : ''}"><i class="bi bi-check-circle"></i> OK</span>`;
    }
    if (st === 'issues') {
        const issues = res.issues || [];
        const tip = issues.map((it, i) => `${i + 1}. [${it.severity || 'minor'}] ${it.location ? it.location + ': ' : ''}${it.description || ''}`).join('\n') || 'Issues found';
        return `<span class="badge bg-danger ms-2" style="cursor:help" title="${_aiEscapeAttr(tip + (when ? '\n(' + when + ')' : ''))}"><i class="bi bi-exclamation-triangle"></i> ${issues.length} issue(s)</span>`;
    }
    if (st === 'error') {
        return `<span class="badge bg-warning text-dark ms-2" style="cursor:help" title="${_aiEscapeAttr(String(res.raw || 'Check error').slice(0, 600))}"><i class="bi bi-question-circle"></i> check error</span>`;
    }
    if (st === 'checking') {
        return `<span class="badge bg-info text-dark ms-2"><i class="bi bi-hourglass-split"></i> checking</span>`;
    }
    return '';
}

// Prominent + EDITABLE proofread status bar for an asset slot (rollup across
// IMG / MD / DOC formats — each format may carry its own check_state).
function renderCheckStatusBar(questionId, lang, atype, parts) {
    if (!window.OQB_AI_TOOLS_ENABLED || !parts || parts.length === 0) return '';
    const checked = _worstCheckPart(parts);
    const st = checked ? checked.check_state : null;
    const res = (checked && checked.check_result) || {};
    const when = (checked && checked.checked_at) ? window.oqbFormatLocalTime(checked.checked_at) : '';
    const who = res.checked_by === 'manual' ? 'manual' : (res.model ? `AI: ${res.model}` : (res.checked_by || ''));
    const ref = res.ref_version ? `vs ${res.ref_version}` : '';

    const META = {
        ok:    { cls: 'success', icon: 'bi-check-circle-fill',      label: 'Proofread OK' },
        issues:{ cls: 'danger',  icon: 'bi-exclamation-triangle-fill', label: 'Issues found' },
        error: { cls: 'warning', icon: 'bi-question-circle-fill',   label: 'Check error' },
        checking:{ cls: 'info',  icon: 'bi-hourglass-split',        label: 'Checking…' },
    };
    const meta = META[st] || { cls: 'secondary', icon: 'bi-shield', label: 'Not proofread' };

    // Body: issue list / raw error / meta line.
    let body = '';
    if (st === 'issues') {
        const issues = res.issues || [];
        body = `<ul class="mb-0 mt-1 ps-3 small">` + (issues.length
            ? issues.map(it => `<li><span class="badge bg-${it.severity === 'critical' ? 'dark' : it.severity === 'major' ? 'danger' : 'secondary'} me-1">${_aiEscapeAttr(it.severity || 'minor')}</span>${it.location ? '<strong>' + _aiEscapeAttr(it.location) + ':</strong> ' : ''}${_aiEscapeAttr(it.description || '')}</li>`).join('')
            : '<li>Marked as having issues.</li>') + `</ul>`;
    } else if (st === 'error') {
        body = `<div class="small mt-1 text-truncate" style="max-width:100%;">${_aiEscapeAttr(String(res.raw || 'Unparseable check reply').slice(0, 300))}</div>`;
    } else if (st === 'ok' && res.note) {
        body = `<div class="small mt-1">${_aiEscapeAttr(res.note)}</div>`;
    }
    const metaLine = (st && (when || who || ref))
        ? `<div class="small text-muted mt-1">${[ref, who, when].filter(Boolean).map(_aiEscapeAttr).join(' · ')}</div>`
        : '';

    // Action buttons (always allow re-marking / clearing + an AI quick-check).
    const baseCall = `setSlotCheckState(${questionId}, '${lang}', '${atype}',`;
    const btns = `
        <div class="btn-group btn-group-sm flex-shrink-0 ms-2" role="group">
            <button type="button" class="btn btn-outline-primary" title="Proofread with AI against a reference version"
                    onclick="event.stopPropagation(); openQuickCheckModal(${questionId}, '${lang}', '${atype}')"><i class="bi bi-robot"></i></button>
            <button type="button" class="btn btn-outline-success" title="Mark as correct"
                    onclick="event.stopPropagation(); ${baseCall} 'ok')"><i class="bi bi-check-lg"></i></button>
            <button type="button" class="btn btn-outline-danger" title="Mark as having an issue (add a note)"
                    onclick="event.stopPropagation(); ${baseCall} 'issues')"><i class="bi bi-flag"></i></button>
            <button type="button" class="btn btn-outline-secondary" title="Clear status (set back to unchecked)"
                    ${st ? '' : 'disabled'} onclick="event.stopPropagation(); ${baseCall} 'clear')"><i class="bi bi-x-lg"></i></button>
        </div>`;

    return `
        <div class="ai-check-bar alert alert-${meta.cls} d-flex justify-content-between align-items-start py-2 px-3 mb-2" role="alert">
            <div class="flex-grow-1" style="min-width:0;">
                <span class="fw-semibold"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span>
                ${body}
                ${metaLine}
            </div>
            ${btns}
        </div>`;
}

// Manually set/clear a slot's proofread status. For 'issues' we prompt for a
// short note. Posts to the admin endpoint then refreshes the assets view.
function setSlotCheckState(questionId, lang, atype, state) {
    let note = '';
    let severity = 'minor';
    if (state === 'issues') {
        note = window.prompt(`Describe the issue with ${atype} (${lang}):`, '');
        if (note === null) return; // cancelled
        note = note.trim();
    } else if (state === 'clear') {
        if (!confirm(`Clear the proofread status for ${atype} (${lang})?`)) return;
    }
    const url = `{{ url_for('admin.set_asset_check_state', question_id=0) }}`.replace('/questions/0/', `/questions/${questionId}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ version: lang, asset_type: atype, state: state, note: note, severity: severity })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
        if (ok && d.success) {
            const labels = { ok: 'marked correct', issues: 'marked with an issue', clear: 'cleared', error: 'marked as error' };
            showToast(`${atype} (${lang}) — ${labels[state] || 'updated'}`, state === 'issues' ? 'warning' : 'success');
            refreshAssetsView(questionId);
            markEditModalListStale();
        } else {
            showToast((d && (d.error || d.message)) || 'Could not update status', 'danger');
        }
    })
    .catch(err => showToast('Error: ' + err.message, 'danger'));
}

// Versions that have at least one IMG part for (atype) anywhere on this question.
function _oqbImgVersionsForAtype(assetsRoot, atype) {
    const out = [];
    const allVers = window.OQB_VERSIONS || ['EN', 'CH', 'BI', 'ENO', 'CHO'];
    allVers.forEach(ver => {
        const parts = ((assetsRoot || {})[ver] || {})[atype] || [];
        const n = parts.filter(p => p.file_format === 'IMG').length;
        if (n > 0) out.push({ ver, count: n });
    });
    return out;
}

// Preferred source-image version order when generating MD for ``targetVer``.
function _mdSourceVersionPriority(targetVer) {
    const all = window.OQB_VERSIONS || ['EN', 'CH', 'BI', 'ENO', 'CHO'];
    const defaultPri = window.OQB_DEFAULT_VERSION_PRIORITY || ['EN', 'CH', 'BI', 'ENO', 'CHO'];
    const official = { EN: 'ENO', CH: 'CHO', BI: 'ENO', ENO: 'EN', CHO: 'CH' };
    const tailAfterOfficial = {
        EN: ['BI', 'CH', 'CHO'],
        CH: ['BI', 'EN', 'ENO', 'CHO'],
        BI: ['EN', 'ENO', 'CH', 'CHO'],
        ENO: ['BI', 'CH', 'CHO'],
        CHO: ['BI', 'EN', 'ENO'],
    };
    const out = [];
    const seen = new Set();
    const add = (v) => {
        if (v && all.includes(v) && !seen.has(v)) { seen.add(v); out.push(v); }
    };
    add(targetVer);
    const off = official[targetVer];
    if (off && off !== targetVer) add(off);
    (tailAfterOfficial[targetVer] || defaultPri).forEach(add);
    defaultPri.forEach(add);
    all.forEach(add);
    return out;
}

function _defaultMdSourceVersion(targetVer, assetsRoot, atype) {
    const available = new Set(_oqbImgVersionsForAtype(assetsRoot, atype).map(x => x.ver));
    for (const v of _mdSourceVersionPriority(targetVer)) {
        if (available.has(v)) return v;
    }
    return null;
}

function _oqbQuestionAssets(questionId) {
    if (editQuestionData && editQuestionData.id === questionId && editQuestionData._assets) {
        return editQuestionData._assets;
    }
    return (window._oqbQuestionAssets || {})[questionId] || null;
}

// Per-slot "Generate Markdown with AI" — shown when ANY version has source IMG.
function aiSlotMdButtonHtml(questionId, lang, atype, hasMd) {
    const assetsRoot = _oqbQuestionAssets(questionId);
    if (!window.OQB_AI_TOOLS_ENABLED || !_oqbImgVersionsForAtype(assetsRoot, atype).length) return '';
    if (hasMd) {
        return `<button class="btn btn-sm btn-outline-warning" type="button"
                    title="Regenerate this Markdown with AI (overwrites the current MD)"
                    onclick="event.stopPropagation(); openAiSlotMdModal(${questionId}, '${lang}', '${atype}', true)"><i class="bi bi-robot"></i></button>`;
    }
    return `<button class="btn btn-sm btn-outline-info" type="button"
                title="Transcribe images into Markdown with AI (pick source version if several exist)"
                onclick="event.stopPropagation(); openAiSlotMdModal(${questionId}, '${lang}', '${atype}', false)"><i class="bi bi-robot"></i> Generate with AI</button>`;
}

// Per-slot "Generate IMG" button — renders this MD / DOC source into IMG
// part(s) via the Word COM pipeline (replacing any existing IMG for the slot).
function genImgButtonHtml(questionId, lang, atype, sourceFormat, imgCount) {
    const warn = imgCount ? ' (replaces existing IMG)' : '';
    return `<button class="btn btn-sm btn-outline-success" type="button"
                title="Generate the IMG version from this ${sourceFormat}${warn}"
                onclick="event.stopPropagation(); generateImgFromSlot(${questionId}, '${lang}', '${atype}', '${sourceFormat}', ${imgCount})">
                <i class="bi bi-image"></i> Gen IMG</button>`;
}

function generateImgFromSlot(questionId, lang, atype, sourceFormat, imgCount) {
    if (imgCount && !confirm(`Generate the IMG version of ${atype} (${lang}) from ${sourceFormat}?\n\nThis REPLACES the ${imgCount} existing image part(s) for this slot.`)) return;
    showToast(`Rendering ${sourceFormat} → IMG for ${atype} (${lang})…`, 'info');
    const url = `{{ url_for('admin.generate_img_slot', question_id=0) }}`.replace('/questions/0/', `/questions/${questionId}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ version: lang, asset_type: atype, source_format: sourceFormat, stitch: true })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
        if (ok && d.success) {
            showToast(d.message || 'IMG generated', 'success');
            refreshAssetsView(questionId);
            markEditModalListStale();
        } else {
            showToast((d && (d.error || d.message)) || 'IMG generation failed', 'danger');
        }
    })
    .catch(err => showToast('Error: ' + err.message, 'danger'));
}

function renderAssetSections(questionId, lang, langAssets, ctx) {

                    </div>

                    <a class="btn btn-sm btn-outline-secondary" target="_blank" href="${fullscreenMdNewUrl}" onclick="event.stopPropagation()">

        } else {

                       onchange="handleAssetFileSelect(event, ${questionId}, '${lang}', '${atype}')">`;
        }
        html += `</div>
        </div>`;
    });
    setTimeout(() => window.oqbLoadMarkdownPreviewCards && window.oqbLoadMarkdownPreviewCards(), 0);
    return html;
}

// Trigger a single-file picker for MD or DOC slots (separate from the
// multi-file image drop-zone).
function triggerSingleFileUpload(questionId, lang, atype, ctx, kind) {
    ctx = ctx || 'edit';
    const inputId = `${ctx}_${kind}Input_${lang}_${atype}`;
    const el = document.getElementById(inputId);
    if (el) el.click();
}

function setActivePasteTarget(lang, atype, ctx) {
    ctx = ctx || 'edit';
    if (ctx === 'add') {
        window.addActivePasteTarget = { lang, atype, ctx: 'add' };
    } else {
        activePasteTarget = { lang, atype, ctx: 'edit' };
    }
    // Update visual indicators — only within the currently visible modal
    const visibleModal = document.querySelector('.modal.show .modal-body') || document;
    visibleModal.querySelectorAll('.asset-section').forEach(el => {
        el.classList.remove('paste-active');
        const hint = el.querySelector('.paste-hint');
        if (hint) hint.style.opacity = '0';
    });
    const activeSection = document.getElementById(`${ctx}_assetSection_${lang}_${atype}`);
    if (activeSection) {
        activeSection.classList.add('paste-active');
        const hint = activeSection.querySelector('.paste-hint');
        if (hint) hint.style.opacity = '1';
    }
}

function triggerAssetUpload(questionId, lang, atype, ctx) {
    ctx = ctx || 'edit';
    document.getElementById(`${ctx}_fileInput_${lang}_${atype}`).click();
}

function handleAssetDrop(event, questionId, lang, atype) {
    event.preventDefault();
    event.currentTarget.classList.remove('drag-over');
    const files = event.dataTransfer.files;
    if (files.length > 0) uploadAssetFiles(questionId, lang, atype, files);
}

function handleAssetFileSelect(event, questionId, lang, atype) {
    const files = event.target.files;
    if (files.length > 0) uploadAssetFiles(questionId, lang, atype, files);
    event.target.value = ''; // reset
}

function refreshAssetsView(questionId) {
    // Determine if we're in the add modal or edit modal and refresh accordingly.
    // The add modal only exists on the admin Question Management page.
    const addModal = document.getElementById('addQuestionModal');
    if (addModal && addModal.classList.contains('show')
        && typeof addCreatedQuestionId !== 'undefined' && addCreatedQuestionId === questionId) {
        // Add modal flow — reload the currently visible language tab
        const activeBtn = document.querySelector('#addAssetUploadArea .btn-group .btn.active');
        const lang = activeBtn ? activeBtn.textContent.trim() : 'EN';
        const area = document.getElementById('addAssetUploadArea');
        fetch(`{{ url_for('admin.question_assets', question_id=0) }}`.replace('/0/', `/${questionId}/`))
            .then(r => r.json())
            .then(data => {
                window._oqbQuestionAssets = window._oqbQuestionAssets || {};
                window._oqbQuestionAssets[questionId] = data.assets || {};
                if (editQuestionData && editQuestionData.id === questionId) {
                    editQuestionData._assets = data.assets || {};
                }
                const langAssets = data.assets[lang] || {};
                const newHtml = renderAssetSections(questionId, lang, langAssets, 'add');
                while (area.children.length > 1) area.removeChild(area.lastChild);
                area.insertAdjacentHTML('beforeend', newHtml);
                // Preserve the user's chosen paste target across the upload-triggered rerender.
                const apt = window.addActivePasteTarget || { lang, atype: 'QUE' };
                setActivePasteTarget(apt.lang || lang, apt.atype || 'QUE', 'add');
            });
    } else {
        loadAssetsForEdit(questionId);
    }
}

function uploadAssetFiles(questionId, lang, atype, files) {
    const formData = new FormData();
    formData.append('version', lang);
    formData.append('asset_type', atype);
    for (let i = 0; i < files.length; i++) formData.append('files', files[i]);

    fetch(`{{ url_for('admin.upload_question_asset', question_id=0) }}`.replace('/0/', `/${questionId}/`), {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            if (data.uploaded_count > 0) {
                showToast(`Uploaded ${data.uploaded_count} asset(s)`);
            }
            if (Array.isArray(data.errors) && data.errors.length > 0) {
                showToast(data.errors.join('\n'), 'warning');
            } else if (data.uploaded_count === 0) {
                showToast('No files uploaded', 'warning');
            }
            refreshAssetsView(questionId);
            if (data.uploaded_count > 0) markEditModalListStale();
        } else {
            showToast(data.error || 'Upload failed', 'danger');
        }
    })
    .catch(err => showToast('Upload error: ' + err.message, 'danger'));
}

function deleteAssetPart(questionId, assetId, filename) {
    if (!confirm(`Delete asset "${filename || 'this part'}"?\n\nThis will remove the file from BOTH the database AND the disk.`)) return;
    fetch(`{{ url_for('admin.delete_question_asset', question_id=0, asset_id=0) }}`.replace('/0/assets/0', `/${questionId}/assets/${assetId}`), {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ delete_from_disk: true })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showToast(data.message);
            refreshAssetsView(questionId);
            markEditModalListStale();
        } else {
            showToast(data.error || 'Error', 'danger');
        }
    })
    .catch(err => showToast('Error: ' + err.message, 'danger'));
}

// ============== Markdown editor modal (inline edit + inline create) ==============
//
// openMdEditorModal(questionId, assetId)                 -> EDIT existing MD asset
// openMdEditorModal(questionId, null, lang, asset_type)  -> CREATE new MD asset
let mdEditorModalInstance = null;
let mdEditorModalEditor = null;
let mdEditorModalState = null;   // { questionId, assetId, lang, atype, isCreate, lastMtime (string), baselineContent }

/** mtime_ns must be a string — JSON numbers lose ns precision in JS. */
function _oqbMtimeNsFromApi(mtime) {
    if (mtime == null || mtime === '') return null;
    return typeof mtime === 'string' ? mtime : String(mtime);
}

function _mdEditorModalIsDirty() {
    if (!mdEditorModalState || !mdEditorModalEditor) return false;
    const cur = mdEditorModalEditor.getValue();
    const base = mdEditorModalState.baselineContent != null ? mdEditorModalState.baselineContent : '';
    return cur !== base;
}

function _mdEditorModalSyncDirtyStatus() {
    const statusEl = document.getElementById('mdEditorModalStatus');
    if (!statusEl || !mdEditorModalState || !mdEditorModalEditor) return;
    if (_mdEditorModalIsDirty()) {
        statusEl.textContent = 'Unsaved changes';
        statusEl.className = 'text-warning';
    } else if (mdEditorModalState.isCreate && !mdEditorModalEditor.getValue()) {
        statusEl.textContent = 'New file. Start typing.';
        statusEl.className = 'text-muted';
    } else {
        statusEl.textContent = 'All changes saved';
        statusEl.className = 'text-success';
    }
}

/** Snapshot editor text as the clean baseline (after load / save). */
function _mdEditorModalMarkClean(statusText) {
    if (!mdEditorModalState || !mdEditorModalEditor) return;
    mdEditorModalState.baselineContent = mdEditorModalEditor.getValue();
    const statusEl = document.getElementById('mdEditorModalStatus');
    if (statusEl) {
        statusEl.textContent = statusText || 'Loaded.';
        statusEl.className = 'text-muted';
    }
}

function openMdEditorModal(questionId, assetId, lang, atype) {
    const isCreate = !assetId;
    const language = lang || 'EN';
    const assetType = atype || 'QUE';

    mdEditorModalState = {
        questionId, assetId, isCreate,
        lang: language, atype: assetType,
        lastMtime: null,
        baselineContent: '',
    };

    const modalEl = document.getElementById('mdEditorModal');
    const titleEl = document.getElementById('mdEditorModalTitle');
    const statusEl = document.getElementById('mdEditorModalStatus');
    const textarea = document.getElementById('mdEditorModalTextarea');
    const saveBtn = document.getElementById('mdEditorModalSaveBtn');
    const fsLink = document.getElementById('mdEditorModalFullscreenLink');

    titleEl.textContent = isCreate
        ? `New Markdown (${assetType}/${language})`
        : `Edit Markdown (${assetType}/${language})`;
    statusEl.textContent = 'Loading...';
    statusEl.className = 'text-muted';

    fsLink.href = isCreate
        ? `/admin/questions/${questionId}/assets/md/new?language=${language}&asset_type=${assetType}`
        : `/admin/questions/${questionId}/assets/${assetId}/md/edit`;

    if (mdEditorModalEditor) {
        try { mdEditorModalEditor.destroy(); } catch (e) {}
        mdEditorModalEditor = null;
    }
    textarea.value = '';

    if (!mdEditorModalInstance) {
        mdEditorModalInstance = new bootstrap.Modal(modalEl);
    }
    modalEl.addEventListener('shown.bs.modal', initOnce, { once: true });
    mdEditorModalInstance.show();

    function initOnce() {
        function buildEditor(initialContent) {
            mdEditorModalState.ignoreChangesUntil = Date.now() + 200;
            mdEditorModalEditor = window.oqbCreateMdEditor(textarea, {
                initialContent: initialContent || '',
                maxSize: {{ md_max_size_bytes if md_max_size_bytes is defined else 5242880 }},
                maxHeight: '55vh',
                onChange: function() {
                    if (mdEditorModalState.ignoreChangesUntil && Date.now() < mdEditorModalState.ignoreChangesUntil) {
                        return;
                    }
                    _mdEditorModalSyncDirtyStatus();
                },
            });
            setTimeout(() => {
                if (mdEditorModalEditor && mdEditorModalEditor.easymde) {
                    mdEditorModalEditor.easymde.codemirror.refresh();
                }
                mdEditorModalState.ignoreChangesUntil = 0;
                _mdEditorModalMarkClean(isCreate ? 'New file. Start typing.' : 'Loaded.');
            }, 80);
        }

        if (isCreate) {
            buildEditor('');
        } else {
            fetch(`/admin/questions/${questionId}/assets/${assetId}/md/content`)
                .then(r => r.json().then(d => ({status: r.status, data: d})))
                .then(({status, data}) => {
                    if (status !== 200) {
                        statusEl.textContent = 'Error: ' + (data.error || 'load failed');
                        statusEl.className = 'text-danger';
                        return;
                    }
                    mdEditorModalState.lastMtime = _oqbMtimeNsFromApi(data.mtime_ns);
                    buildEditor(data.content);
                })
                .catch(err => {
                    statusEl.textContent = 'Error: ' + err.message;
                    statusEl.className = 'text-danger';
                });
        }
    }

    saveBtn.onclick = () => doSaveMdEditorModal(false);
}

function doSaveMdEditorModal(force) {
    const s = mdEditorModalState;
    if (!s || !mdEditorModalEditor) return;
    const statusEl = document.getElementById('mdEditorModalStatus');
    const saveBtn = document.getElementById('mdEditorModalSaveBtn');
    const content = mdEditorModalEditor.getValue();
    const sizeBytes = mdEditorModalEditor.getBytes();
    const maxBytes = mdEditorModalEditor.getMaxBytes();
    if (sizeBytes > maxBytes) {
        statusEl.textContent = `Content too large (${sizeBytes} > ${maxBytes} bytes)`;
        statusEl.className = 'text-danger';
        return;
    }

    statusEl.textContent = 'Saving...';
    statusEl.className = 'text-muted';
    saveBtn.disabled = true;

    let url, body;
    if (s.isCreate) {
        url = `/admin/questions/${s.questionId}/assets/md/create`;
        body = JSON.stringify({ version: s.lang, asset_type: s.atype, content: content });
    } else {
        url = `/admin/questions/${s.questionId}/assets/${s.assetId}/md/save`;
        body = JSON.stringify({
            content: content,
            expected_mtime_ns: s.lastMtime,
            force: !!force,
        });
    }

    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: body,
    })
        .then(r => r.json().then(d => ({status: r.status, data: d})))
        .then(({status, data}) => {
            saveBtn.disabled = false;
            if (status === 409 && !s.isCreate) {
                if (confirm('File changed on disk since you opened it. Overwrite with your changes?')) {
                    doSaveMdEditorModal(true);
                } else {
                    statusEl.textContent = 'Save cancelled (file changed)';
                    statusEl.className = 'text-danger';
                }
                return;
            }
            if (data.success) {
                s.lastMtime = _oqbMtimeNsFromApi(data.mtime_ns);
                s.baselineContent = content;
                statusEl.textContent = 'Saved ' + new Date().toLocaleTimeString();
                statusEl.className = 'text-success';
                refreshAssetsView(s.questionId);
                markEditModalListStale();
                if (s.isCreate && data.asset_id) {
                    s.isCreate = false;
                    s.assetId = data.asset_id;
                    const fsLink = document.getElementById('mdEditorModalFullscreenLink');
                    fsLink.href = `/admin/questions/${s.questionId}/assets/${data.asset_id}/md/edit`;
                    document.getElementById('mdEditorModalTitle').textContent =
                        `Edit Markdown (${s.atype}/${s.lang})`;
                }
                if (mdEditorModalInstance) {
                    mdEditorModalInstance.hide();
                }
            } else {
                statusEl.textContent = 'Error: ' + (data.error || 'save failed');
                statusEl.className = 'text-danger';
            }
        })
        .catch(err => {
            saveBtn.disabled = false;
            statusEl.textContent = 'Error: ' + err.message;
            statusEl.className = 'text-danger';
        });
}

// Warn before closing modal with unsaved changes.
document.addEventListener('DOMContentLoaded', function() {
    const editModalEl = document.getElementById('editQuestionModal');
    if (editModalEl) {
        editModalEl.addEventListener('hidden.bs.modal', flushEditModalListRefresh);
    }

    const modalEl = document.getElementById('mdEditorModal');
    if (!modalEl) return;
    modalEl.addEventListener('hide.bs.modal', function(e) {
        if (_mdEditorModalIsDirty()) {
            if (!confirm('Discard unsaved changes?')) {
                e.preventDefault();
            }
        }
    });
    modalEl.addEventListener('hidden.bs.modal', function() {
        if (mdEditorModalEditor) {
            try { mdEditorModalEditor.destroy(); } catch (e) {}
            mdEditorModalEditor = null;
        }
        mdEditorModalState = null;
    });
});

function moveAssetPart(questionId, lang, atype, currentIdx, direction) {
    // Reorder applies only to IMG parts (MD/DOC are single-slot).
    fetch(`{{ url_for('admin.question_assets', question_id=0) }}`.replace('/0/', `/${questionId}/`))
        .then(r => r.json())
        .then(data => {
            const parts = ((data.assets[lang] || {})[atype] || [])
                .filter(p => p.file_format === 'IMG')
                .sort((a, b) => a.part_number - b.part_number);
            const ids = parts.map(p => p.id);
            const swapIdx = direction === 'up' ? currentIdx - 1 : currentIdx + 1;
            if (swapIdx < 0 || swapIdx >= ids.length) return;
            [ids[currentIdx], ids[swapIdx]] = [ids[swapIdx], ids[currentIdx]];

            return fetch(`{{ url_for('admin.reorder_question_assets', question_id=0) }}`.replace('/0/', `/${questionId}/`), {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ version: lang, asset_type: atype, asset_ids: ids })
            });
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const msg = data.files_renamed > 0 ? `Reordered (${data.files_renamed} file(s) renamed)` : 'Reordered';
                showToast(msg);
                if (data.warnings && data.warnings.length > 0) {
                    showToast('Warnings: ' + data.warnings.join('; '), 'warning');
                }
                refreshAssetsView(questionId);
            } else {
                showToast(data.error || 'Reorder failed', 'danger');
            }
        })
        .catch(err => showToast('Error reordering: ' + err.message, 'danger'));
}

function showFullSize(url) {
    const overlay = document.createElement('div');
    overlay.className = 'fullsize-overlay';
    const img = document.createElement('img');
    img.src = url;
    img.onerror = () => {
        overlay.innerHTML = '<div class="text-white text-center"><i class="bi bi-exclamation-triangle fs-1"></i><br>Image not found</div>';
    };
    overlay.appendChild(img);
    overlay.onclick = (e) => { e.stopPropagation(); overlay.remove(); };
    const onEsc = (e) => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onEsc); } };
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(overlay);
}

// Helper to extract image files from clipboard
function extractImageFiles(clipboardData) {
    const files = [];
    for (let i = 0; i < clipboardData.items.length; i++) {
        if (clipboardData.items[i].type.startsWith('image/')) {
            const blob = clipboardData.items[i].getAsFile();
            const ext = clipboardData.items[i].type.split('/')[1] || 'png';
            files.push(new File([blob], `pasted_image.${ext}`, { type: clipboardData.items[i].type }));
        }
    }
    return files;
}

// Ctrl+V paste support — uses tracked activePasteTarget for section
document.addEventListener('paste', function(e) {
    // If the focused element is inside the Markdown editor, OR the MD editor
    // modal is currently visible, defer to the editor's own paste handler.
    const mdModal = document.getElementById('mdEditorModal');
    if (mdModal && mdModal.classList.contains('show')) return;
    const tgt = e.target;
    if (tgt && (tgt.closest && tgt.closest('.EasyMDEContainer, .CodeMirror'))) return;

    // Handle paste in edit modal
    const editModal = document.getElementById('editQuestionModal');
    if (editModal && editModal.classList.contains('show') && editQuestionData) {
        const activeTab = document.querySelector('#editQuestionModal .tab-pane.active');
        if (!activeTab || activeTab.id !== 'tabAssets') return;

        const files = extractImageFiles(e.clipboardData);
        if (files.length > 0) {
            const activeLangTab = document.querySelector('#langTabs .nav-link.active');
            const lang = activeLangTab ? activeLangTab.getAttribute('href').replace('#lang', '') : activePasteTarget.lang;
            const atype = activePasteTarget.atype;
            uploadAssetFiles(editQuestionData.id, lang, atype, files);
            showToast(`Pasted to ${atype} (${lang})`, 'info');
            e.preventDefault();
        }
        return;
    }

    // Handle paste in add modal (admin Question Management page only)
    const addModal = document.getElementById('addQuestionModal');
    if (addModal && addModal.classList.contains('show')
        && typeof addCreatedQuestionId !== 'undefined' && addCreatedQuestionId) {
        const files = extractImageFiles(e.clipboardData);
        if (files.length > 0) {
            const apt = window.addActivePasteTarget || { lang: 'EN', atype: 'QUE' };
            const lang = apt.lang || 'EN';
            const atype = apt.atype || 'QUE';
            uploadAssetFiles(addCreatedQuestionId, lang, atype, files);
            showToast(`Pasted to ${atype} (${lang})`, 'info');
            e.preventDefault();
        }
    }
});

// ============== Per-slot AI Markdown generation ==============
// Builds a small stacked modal on demand (works on top of the open edit modal)
// to pick an endpoint and generate Markdown for ONE version/atype slot from
// that version's source image(s). Driven by the per-slot "Generate with AI"
// button rendered in renderAssetSections.
let _aiSlotModalInstance = null;

function openAiSlotMdModal(questionId, version, atype, hasMd) {
    const assetsRoot = _oqbQuestionAssets(questionId);
    const imgVers = _oqbImgVersionsForAtype(assetsRoot, atype);
    if (!imgVers.length) {
        showToast(`No ${atype} images on any version to transcribe.`, 'warning');
        return;
    }
    const defaultSrc = _defaultMdSourceVersion(version, assetsRoot, atype) || imgVers[0].ver;
    const srcVersOrdered = _mdSourceVersionPriority(version)
        .filter(v => imgVers.some(x => x.ver === v));
    const srcOptions = srcVersOrdered.map(v => {
        const n = (imgVers.find(x => x.ver === v) || {}).count || 0;
        const sel = v === defaultSrc ? ' selected' : '';
        return `<option value="${v}"${sel}>${v} (${n} image part${n === 1 ? '' : 's'})</option>`;
    }).join('');
    const srcPickHtml = srcVersOrdered.length > 1
        ? `<div class="mb-3">
              <label class="form-label fw-bold" for="aiSlotSourceVersion">Source images (version)</label>
              <select class="form-select form-select-sm" id="aiSlotSourceVersion">${srcOptions}</select>
              <div class="form-text">Transcribe from the chosen version's image(s). Default: this slot's version, then its official scan (e.g. EN → ENO), then other versions with images.</div>
            </div>`
        : `<input type="hidden" id="aiSlotSourceVersion" value="${_aiEscapeAttr(defaultSrc)}">
            <p class="small mb-3">Source images: <strong>${_aiEscapeAttr(defaultSrc)}</strong> (${(imgVers.find(x => x.ver === defaultSrc) || {}).count || 0} part(s))</p>`;

    let el = document.getElementById('aiSlotMdModal');
    if (el) el.remove();
    el = document.createElement('div');
    el.id = 'aiSlotMdModal';
    el.className = 'modal fade';
    el.tabIndex = -1;
    el.setAttribute('data-bs-backdrop', 'static');
    el.innerHTML = `
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-robot"></i> Generate Markdown with AI</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted mb-2">Target slot: <strong>${_aiEscapeAttr(atype)}</strong> &middot; version <strong>${_aiEscapeAttr(version)}</strong> (Markdown is saved here).</p>
            ${srcPickHtml}
            <div class="mb-3">
              <label class="form-label fw-bold" for="aiSlotEndpoint">LLM endpoint</label>
              <select class="form-select form-select-sm" id="aiSlotEndpoint"><option value="">Loading…</option></select>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" id="aiSlotEmbed" checked>
              <label class="form-check-label" for="aiSlotEmbed">Embed figures (cropped when possible) — only when the question has a diagram</label>
            </div>
            ${hasMd ? '<div class="alert alert-warning py-2 small mb-2"><i class="bi bi-exclamation-triangle"></i> This will <strong>overwrite</strong> the existing Markdown for this slot.</div>' : ''}
            <div id="aiSlotStatus" class="small text-muted"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="aiSlotGenBtn"><i class="bi bi-robot"></i> Generate</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(el);

    const sel = el.querySelector('#aiSlotEndpoint');
    fetch(`{{ url_for('admin.ai_endpoints') }}`)
        .then(r => r.json())
        .then(data => {
            const eps = data.endpoints || [];
            if (!eps.length) { sel.innerHTML = '<option value="">No endpoints configured</option>'; return; }
            sel.innerHTML = eps.map(ep => {
                const vis = ep.supports_vision ? '' : ' (text-only — not usable)';
                return `<option value="${ep.id}"${ep.supports_vision ? '' : ' disabled'}>${_aiEscapeAttr(ep.name)} — ${_aiEscapeAttr(ep.model_name)}${vis}</option>`;
            }).join('');
            const id = _aiPickDefaultEndpointId(eps, data.defaults, 'md');
            if (id != null) sel.value = String(id);
        })
        .catch(() => { sel.innerHTML = '<option value="">Failed to load endpoints</option>'; });

    el.querySelector('#aiSlotGenBtn').onclick = () => runAiSlotMd(questionId, version, atype, hasMd, el);
    el.addEventListener('hidden.bs.modal', () => {
        el.remove();
        // Closing a stacked modal can drop the parent modal's scroll lock —
        // restore it if the edit modal is still open underneath.
        const editModal = document.getElementById('editQuestionModal');
        if (editModal && editModal.classList.contains('show')) {
            document.body.classList.add('modal-open');
        }
    });
    _aiSlotModalInstance = new bootstrap.Modal(el);
    _aiSlotModalInstance.show();
}

function runAiSlotMd(questionId, version, atype, hasMd, el) {
    const sel = el.querySelector('#aiSlotEndpoint');
    const endpointId = sel.value;
    if (!endpointId) { showToast('Select a vision-capable endpoint first.', 'warning'); return; }
    const sourceVersion = (el.querySelector('#aiSlotSourceVersion') || {}).value || version;
    const embed = el.querySelector('#aiSlotEmbed').checked;
    const btn = el.querySelector('#aiSlotGenBtn');
    const status = el.querySelector('#aiSlotStatus');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generating…';
    status.textContent = `Transcribing ${atype} images from ${sourceVersion} into ${version} Markdown…`;

    const url = `{{ url_for('admin.ai_generate_md_slot', question_id=0) }}`.replace('/questions/0/', `/questions/${questionId}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            version: version,
            source_version: sourceVersion,
            asset_type: atype,
            endpoint_id: parseInt(endpointId, 10),
            embed_image: embed,
            overwrite: !!hasMd
        })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d: d })))
    .then(({ ok, d }) => {
        if (ok && d.success) {
            showToast(d.message || 'Markdown generated', 'success');
            if (_aiSlotModalInstance) _aiSlotModalInstance.hide();
            refreshAssetsView(questionId);
            markEditModalListStale();
        } else {
            status.innerHTML = `<span class="text-danger">${_aiEscapeAttr((d && (d.message || d.error)) || 'Generation failed')}</span>`;
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-robot"></i> Generate';
        }
    })
    .catch(err => {
        status.innerHTML = `<span class="text-danger">Network error: ${_aiEscapeAttr(err.message)}</span>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-robot"></i> Generate';
    });
}

// ============== Per-slot AI proofread ("Quick check") ==============
//
// Proofread every present format in the slot (IMG / MD / DOC — MD/DOC rendered
// to images first) against a chosen reference version.
let _quickCheckModalInstance = null;

function _defaultRefVersion(typed) {
    // Sensible default reference scan for a typed version.
    const map = { EN: 'ENO', CH: 'CHO', BI: 'ENO', ENO: 'EN', CHO: 'CH' };
    return map[typed] || (typed === 'EN' ? 'ENO' : 'EN');
}

function openQuickCheckModal(questionId, version, atype) {
    const allVers = window.OQB_VERSIONS || ['EN', 'CH', 'BI', 'ENO', 'CHO'];
    const def = _defaultRefVersion(version);
    const refOptions = allVers.filter(v => v !== version)
        .map(v => `<option value="${v}"${v === def ? ' selected' : ''}>${v}</option>`).join('');

    let el = document.getElementById('quickCheckModal');
    if (el) el.remove();
    el = document.createElement('div');
    el.id = 'quickCheckModal';
    el.className = 'modal fade';
    el.tabIndex = -1;
    el.setAttribute('data-bs-backdrop', 'static');
    el.innerHTML = `
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-robot"></i> Proofread with AI</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted mb-2">Proofread <strong>${_aiEscapeAttr(atype)} / ${_aiEscapeAttr(version)}</strong> against a reference version. Every present format (IMG, MD, DOCX) is checked separately; MD and DOCX are rendered to images first.</p>
            <div class="row g-2 mb-2">
              <div class="col-7">
                <label class="form-label fw-bold mb-1" for="qcEndpoint">LLM endpoint</label>
                <select class="form-select form-select-sm" id="qcEndpoint"><option value="">Loading…</option></select>
              </div>
              <div class="col-5">
                <label class="form-label fw-bold mb-1" for="qcRefVersion">Reference</label>
                <select class="form-select form-select-sm" id="qcRefVersion">${refOptions}</select>
              </div>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" id="qcRecheck" checked>
              <label class="form-check-label" for="qcRecheck">Re-check even if already proofread</label>
            </div>
            <div id="qcStatus" class="small text-muted"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="qcRunBtn"><i class="bi bi-robot"></i> Run check</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(el);

    const sel = el.querySelector('#qcEndpoint');
    fetch(`{{ url_for('admin.ai_endpoints') }}`)
        .then(r => r.json())
        .then(data => {
            const eps = data.endpoints || [];
            if (!eps.length) { sel.innerHTML = '<option value="">No endpoints configured</option>'; return; }
            sel.innerHTML = eps.map(ep => {
                const vis = ep.supports_vision ? '' : ' (text-only — not usable)';
                return `<option value="${ep.id}"${ep.supports_vision ? '' : ' disabled'}>${_aiEscapeAttr(ep.name)} — ${_aiEscapeAttr(ep.model_name)}${vis}</option>`;
            }).join('');
            const id = _aiPickDefaultEndpointId(eps, data.defaults, 'check');
            if (id != null) sel.value = String(id);
        })
        .catch(() => { sel.innerHTML = '<option value="">Failed to load endpoints</option>'; });

    el.querySelector('#qcRunBtn').onclick = () => runQuickCheck(questionId, version, atype, el);
    el.addEventListener('hidden.bs.modal', () => {
        el.remove();
        const editModal = document.getElementById('editQuestionModal');
        if (editModal && editModal.classList.contains('show')) {
            document.body.classList.add('modal-open');
        }
    });
    _quickCheckModalInstance = new bootstrap.Modal(el);
    _quickCheckModalInstance.show();
}

function runQuickCheck(questionId, version, atype, el) {
    const endpointId = el.querySelector('#qcEndpoint').value;
    if (!endpointId) { showToast('Select a vision-capable endpoint first.', 'warning'); return; }
    const refVersion = el.querySelector('#qcRefVersion').value;
    const recheck = el.querySelector('#qcRecheck').checked;
    const btn = el.querySelector('#qcRunBtn');
    const status = el.querySelector('#qcStatus');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Checking…';
    status.textContent = 'Checking each present format (IMG / MD / DOCX) — MD/DOC are rendered first…';

    const url = `{{ url_for('admin.ai_check_slot', question_id=0) }}`.replace('/questions/0/', `/questions/${questionId}/`);
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            version: version, asset_type: atype, ref_version: refVersion,
            endpoint_id: parseInt(endpointId, 10), recheck: recheck
        })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
        if (ok && d.success) {
            const tone = d.state === 'issues' ? 'warning' : 'success';
            showToast(d.message || 'Check complete', tone);
            if (_quickCheckModalInstance) _quickCheckModalInstance.hide();
            refreshAssetsView(questionId);
            markEditModalListStale();
        } else {
            status.innerHTML = `<span class="text-${d && d.status === 'skip' ? 'warning' : 'danger'}">${_aiEscapeAttr((d && (d.message || d.error)) || 'Check failed')}</span>`;
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-robot"></i> Run check';
        }
    })
    .catch(err => {
        status.innerHTML = `<span class="text-danger">Network error: ${_aiEscapeAttr(err.message)}</span>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-robot"></i> Run check';
    });
}
