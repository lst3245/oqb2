{# Subject switcher for Topics / Chapters. Expects: subjects, subject, endpoint. #}
{% if subjects|length > 1 %}
<select class="form-select form-select-sm" style="width:auto" aria-label="{{ t('Subject') }}"
        onchange="if (this.value) location.href = this.value;">
    {% for s in subjects %}
    <option value="{{ url_for(endpoint, subject_id=s.id) }}"
            {% if subject and s.id == subject.id %}selected{% endif %}>
        {{ s.id }} — {{ tax_name(s) }}
    </option>
    {% endfor %}
</select>
{% endif %}
