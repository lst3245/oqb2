{% extends "base.html" %}

{% block title %}{{ t('Session expired') }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
            <div class="alert alert-warning">
                <h4 class="alert-heading">{{ t('Session expired') }}</h4>
                <p class="mb-2">{{ message }}</p>
                <a class="btn btn-primary btn-sm" href="{{ url_for('auth.index') }}">{{ t('Back to the Question Bank') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
