<script>
// ===================== TREE LIST + SELECTION =====================
// One row per whole question (root) with its parts nested underneath. Rows
// that did not hit the filters are shown dimmed for context. Ticking a row
// selects its whole subtree; "Select all matching" selects exactly the
// matching rows of the subject (server /api/ids).

function aqReload() {
    if (!AQ.subject) { aqRenderEmpty('<i class="bi bi-book"></i>Pick a subject to start.'); return Promise.resolve(); }
    const seq = ++AQ.seq;
    const tbody = document.getElementById('aqTbody');
    if (!AQ.data || AQ.data.subject !== AQ.subject) {
        tbody.innerHTML = '<tr><td colspan="11" class="aq-empty-state"><span class="spinner-border"></span></td></tr>';
    } else {
        tbody.classList.add('opacity-50');
    }
    return aqPost(AQ.cfg.urls.tree, aqQuery({ page: AQ.page, page_size: AQ.pageSize }))
        .then(d => {
            if (seq !== AQ.seq || d.subject !== AQ.subject) return;
            AQ.data = d;
            AQ.page = d.page;
            AQ.nodes = new Map();
            const walk = n => { AQ.nodes.set(n.id, n); n.children.forEach(walk); };
            d.items.forEach(walk);
            aqRender();
        })
        .catch(err => {
            if (seq !== AQ.seq) return;
            aqRenderEmpty(`<i class="bi bi-exclamation-triangle text-danger"></i>Could not load questions: ${aqEsc(err.message)}`);
        })
        .finally(() => tbody.classList.remove('opacity-50'));
}

// The shared edit modal refreshes its host list through these names.
function loadQuestions() { return aqReload(); }
window.oqbAfterQuestionEdit = loadQuestions;
window.oqbEditNavSource = function () {
    return Array.from(document.querySelectorAll('#aqTbody tr.aq-row:not(.d-none)'))
        .map(tr => Number(tr.dataset.id)).filter(n => !isNaN(n));
};

function aqRenderEmpty(html) {
    AQ.data = null;
    AQ.nodes = new Map();
    document.getElementById('aqTbody').innerHTML = `<tr><td colspan="11" class="aq-empty-state">${html}</td></tr>`;
    document.getElementById('aqPageInfo').textContent = '';
    document.getElementById('aqPagination').innerHTML = '';
    document.getElementById('aqResultSummary').textContent = '';
    aqUpdateSelectionUI();
}

function aqFiltersActive() {
    const f = AQ.filters;
    return !!(AQ.pinned || f.q || f.source || f.years.length || f.paper || f.q_type
        || (f.tree_scope && f.tree_scope !== 'all') || f.verified !== '' || f.check_status || f.has_whole);
}

function aqDescendantMatches(node) {
    return node.matched_count - (node.matched ? 1 : 0);
}

function aqIsOpen(node) {
    if (!node.children.length) return false;
    if (AQ.open.has(node.id)) return AQ.open.get(node.id);
    return !node.matched && aqDescendantMatches(node) > 0;
}

function aqToggleOpen(id) {
    const node = AQ.nodes.get(id);
    if (!node) return;
    AQ.open.set(id, !aqIsOpen(node));
    aqRender();
}

function aqExpandAll(open) {
    AQ.nodes.forEach(n => { if (n.children.length) AQ.open.set(n.id, open); });
    aqRender();
}

// ---- indicators ----
function aqWholeIndicator(n) {
    if (!n.has_whole) return '';
    const ids = (n.whole_asset_ids || []).join(',');
    return ` <button type="button" class="btn btn-sm btn-link p-0 align-baseline text-secondary"
        title="Whole-question archive kept (${(n.whole_asset_ids || []).length} image(s)). Click to preview; manage in Edit → Assets."
        onclick="event.stopPropagation(); aqPreviewWhole('${ids}')"><i class="bi bi-archive"></i></button>`;
}

function aqPreviewWhole(idCsv) {
    const id = String(idCsv || '').split(',').filter(Boolean)[0];
    if (!id) return;
    const url = `/dashboard/api/asset_preview/${id}`;
    if (typeof showFullSize === 'function') showFullSize(url); else window.open(url, '_blank');
}

function aqCheckIndicator(cs) {
    cs = cs || { status: 'none', total: 0 };
    if (cs.status === 'issues') return `<span class="badge bg-danger" title="${cs.issues || 0} asset(s) flagged with issues"><i class="bi bi-exclamation-triangle-fill"></i> Issues</span>`;
    if (cs.status === 'ok') return `<span class="badge bg-success" title="All ${cs.total || 0} asset(s) checked OK"><i class="bi bi-check-circle-fill"></i> OK</span>`;
    if (cs.status === 'unchecked') return `<span class="badge bg-warning text-dark" title="${cs.unchecked || 0} of ${cs.total || 0} asset(s) not checked yet"><i class="bi bi-hourglass-split"></i> ${cs.unchecked || 0} unchecked</span>`;
    return '<span class="text-muted" title="No assets in the status scope">—</span>';
}

function aqVerifiedIndicator(v) {
    return v
        ? '<span class="badge bg-success" title="Question verified"><i class="bi bi-patch-check-fill"></i></span>'
        : '<span class="text-muted" title="Not verified">—</span>';
}

function aqPaperText(n) {
    if (n.source === 'QB') {
        const m = /_QB_([^_]+)_/.exec(n.qid || '');
        return `<span class="badge bg-info">QB</span> ${aqEsc(m ? m[1] : '')}`;
    }
    return `<span class="badge bg-secondary">${aqEsc(n.source)}</span> ${aqEsc(n.year || '')} ${aqEsc(n.paper || '')}`;
}

// ---- rendering ----
function aqRowHtml(node, hidden, dimUnmatched) {
    const root = node.depth === 0;
    const hasKids = node.children.length > 0;
    const open = aqIsOpen(node);
    const caret = hasKids
        ? `<button type="button" class="aq-caret${open ? ' aq-open' : ''}" onclick="aqToggleOpen(${node.id})"
               title="${open ? 'Hide' : 'Show'} ${node.children.length} part(s)"><i class="bi bi-chevron-right"></i></button>`
        : '<span class="aq-caret d-inline-block"></span>';
    const blockIcon = node.is_block ? '<i class="bi bi-layers text-secondary" title="Shared text printed before the parts it covers"></i> ' : '';
    const label = node.is_block && typeof blockScopeText === 'function'
        ? blockScopeText(node.part, node.block_end) : node.label;
    const kids = hasKids && !open ? ` <span class="badge rounded-pill bg-light text-secondary border">${node.subtree_ids.length - 1} parts</span>` : '';
    const hiddenHits = hasKids && !open && aqDescendantMatches(node) > 0 && dimUnmatched
        ? `<span class="aq-match-dot" title="${aqDescendantMatches(node)} part(s) inside match the filters"></span>` : '';
    const vers = (node.que_versions || []).map(v => `<span class="badge bg-primary-subtle text-primary-emphasis aq-ver">${v}</span>`).join('')
        || '<span class="text-muted">—</span>';
    const cls = ['aq-row', root ? 'aq-row-root' : 'aq-row-child'];
    if (hidden) cls.push('d-none');
    if (dimUnmatched && !node.matched) cls.push('aq-dim');
    if (AQ.selected.has(node.id)) cls.push('aq-selected');
    const splitItem = !hasKids
        ? `<li><a class="dropdown-item" href="/admin/questions/${node.id}/split"><i class="bi bi-scissors"></i> Split into parts</a></li>` : '';
    const combineItem = hasKids
        ? `<li><a class="dropdown-item" href="#" onclick="aqRowOp('combine', ${node.id}); return false;"><i class="bi bi-intersect"></i> Combine parts…</a></li>` : '';
    return `<tr class="${cls.join(' ')}" data-id="${node.id}" data-qid="${aqEsc(node.qid)}">
        <td class="aq-cell-check"><input type="checkbox" class="form-check-input aq-check" data-id="${node.id}"
            onchange="aqToggleNode(${node.id}, this.checked)" title="${hasKids ? 'Select with its parts' : 'Select'}"></td>
        <td>
            <span class="aq-indent" style="width:${node.depth * 1.4}rem"></span>${caret}
            <span class="aq-label">${blockIcon}${aqEsc(label)}</span>${kids}${hiddenHits}
            <div class="aq-qid" style="padding-left:${node.depth * 1.4 + 1.4}rem"><code class="text-reset">${aqEsc(node.qid)}</code></div>
        </td>
        <td>${root ? aqPaperText(node) : ''}</td>
        <td>${root ? aqEsc(node.qno) + (node.qno_end ? '–' + aqEsc(node.qno_end) : '') : ''}</td>
        <td>${aqEsc(node.q_type || '') || '<span class="text-muted">—</span>'}</td>
        <td>${vers}</td>
        <td><span class="badge text-dark bg-light border">${node.asset_count}</span>${aqWholeIndicator(node)}</td>
        <td>${aqCheckIndicator(node.check_summary)}</td>
        <td>${aqVerifiedIndicator(node.verified)}</td>
        <td><small class="text-muted">${window.oqbFormatLocalTime ? window.oqbFormatLocalTime(node.created_at) : aqEsc(node.created_at)}</small></td>
        <td class="text-end text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="openEditModal(${node.id})" title="Edit"><i class="bi bi-pencil"></i></button>
            <div class="dropdown d-inline-block">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="dropdown" title="More"><i class="bi bi-three-dots-vertical"></i></button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="${AQ.cfg.urls.dashboard}?qids=${encodeURIComponent(node.qid)}" target="_blank"><i class="bi bi-grid"></i> Open in dashboard</a></li>
                    <li><a class="dropdown-item" href="#" onclick="aqOpenSmartImportFor(['${aqEsc(node.qid)}']); return false;"><i class="bi bi-folder-plus"></i> Import files…</a></li>
                    ${splitItem}${combineItem}
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="aqRowOp('deleteQuestions', ${node.id}); return false;"><i class="bi bi-trash"></i> Delete…</a></li>
                </ul>
            </div>
        </td>
    </tr>`;
}

function aqRender() {
    const d = AQ.data;
    const tbody = document.getElementById('aqTbody');
    aqUpdateSortHeader();
    if (!d) return;
    const name = aqEsc(AQ.subject);
    if (!d.items.length) {
        const filtered = aqFiltersActive();
        tbody.innerHTML = `<tr><td colspan="11" class="aq-empty-state"><i class="bi bi-inbox"></i>
            ${filtered ? `No questions in ${name} match these filters.
                <div class="mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="aqResetFilters()">Reset filters</button></div>`
                : `${name} has no questions yet.`}</td></tr>`;
        document.getElementById('aqPageInfo').textContent = '';
        document.getElementById('aqPagination').innerHTML = '';
        document.getElementById('aqResultSummary').textContent = filtered ? `0 of ${d.subject_rows} rows in ${AQ.subject}` : '';
        aqUpdateSelectionUI();
        return;
    }
    const dim = aqFiltersActive();
    const html = [];
    const walk = (node, hidden) => {
        html.push(aqRowHtml(node, hidden, dim));
        const open = aqIsOpen(node);
        node.children.forEach(c => walk(c, hidden || !open));
    };
    d.items.forEach(n => walk(n, false));
    tbody.innerHTML = html.join('');

    const start = (d.page - 1) * d.page_size + 1;
    const end = Math.min(d.page * d.page_size, d.total_roots);
    document.getElementById('aqPageInfo').textContent = `Questions ${start}–${end} of ${d.total_roots}`;
    document.getElementById('aqResultSummary').textContent = dim
        ? `${d.total_matched} matching row(s) in ${d.total_roots} question(s) · ${AQ.subject} has ${d.subject_rows} rows`
        : `${d.total_roots} questions · ${d.total_rows} rows in ${AQ.subject}`;
    aqRenderPagination(d);
    aqRefreshChecks();
    aqUpdateSelectionUI();
}

function aqUpdateSortHeader() {
    document.querySelectorAll('#aqTable th.aq-sortable').forEach(th => {
        const on = th.dataset.sort === AQ.sort.field;
        th.classList.toggle('aq-sorted', on);
        const icon = th.querySelector('.aq-sort-icon');
        if (icon) icon.className = 'bi aq-sort-icon ' + (on ? (AQ.sort.dir === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up');
    });
}

function aqRenderPagination(d) {
    const ul = document.getElementById('aqPagination');
    if (d.total_pages <= 1) { ul.innerHTML = ''; return; }
    const p = d.page, tp = d.total_pages;
    const item = (n, label, disabled, active) =>
        `<li class="page-item${disabled ? ' disabled' : ''}${active ? ' active' : ''}"><a class="page-link" href="#" onclick="aqGoToPage(${n}); return false;">${label}</a></li>`;
    let html = item(p - 1, '&laquo;', p === 1);
    const lo = Math.max(1, p - 2), hi = Math.min(tp, p + 2);
    if (lo > 1) html += item(1, '1');
    if (lo > 2) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
    for (let i = lo; i <= hi; i++) html += item(i, i, false, i === p);
    if (hi < tp - 1) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
    if (hi < tp) html += item(tp, tp);
    html += item(p + 1, '&raquo;', p === tp);
    ul.innerHTML = html;
}

// ---- selection ----
function aqSelectRow(node, on) {
    if (on) AQ.selected.set(node.id, { qid: node.qid, root: node.parent_id == null });
    else AQ.selected.delete(node.id);
}

function aqSubtreeState(node) {
    let n = 0;
    node.subtree_ids.forEach(id => { if (AQ.selected.has(id)) n++; });
    return n === 0 ? 'none' : (n === node.subtree_ids.length ? 'all' : 'some');
}

function aqToggleNode(id, checked) {
    const node = AQ.nodes.get(id);
    if (!node) return;
    // A partly selected subtree becomes fully selected on click.
    const on = aqSubtreeState(node) !== 'all';
    node.subtree_ids.forEach(sid => { const n = AQ.nodes.get(sid); if (n) aqSelectRow(n, on); });
    AQ.allMatching = null;
    aqRefreshChecks();
    aqUpdateSelectionUI();
}

function aqPageState() {
    if (!AQ.data || !AQ.data.items.length) return 'none';
    let all = 0, sel = 0;
    AQ.nodes.forEach(n => { all++; if (AQ.selected.has(n.id)) sel++; });
    return sel === 0 ? 'none' : (sel === all ? 'all' : 'some');
}

function aqTogglePage(checked) {
    const on = aqPageState() !== 'all';
    AQ.nodes.forEach(n => aqSelectRow(n, on));
    AQ.allMatching = null;
    aqRefreshChecks();
    aqUpdateSelectionUI();
}

function aqRefreshChecks() {
    document.querySelectorAll('#aqTbody .aq-check').forEach(cb => {
        const node = AQ.nodes.get(Number(cb.dataset.id));
        if (!node) return;
        const st = aqSubtreeState(node);
        cb.checked = st === 'all';
        cb.indeterminate = st === 'some';
        cb.closest('tr').classList.toggle('aq-selected', AQ.selected.has(node.id));
    });
    const pc = document.getElementById('aqPageCheck');
    const ps = aqPageState();
    pc.checked = ps === 'all';
    pc.indeterminate = ps === 'some';
}

function aqClearSelection() {
    AQ.selected.clear();
    AQ.allMatching = null;
    aqRefreshChecks();
    aqUpdateSelectionUI();
}

function aqSelectAllMatching() {
    const btn = document.getElementById('aqSelectAllMatchingBtn');
    btn.disabled = true;
    const sig = aqFilterSignature();
    aqPost(AQ.cfg.urls.ids, aqQuery())
        .then(d => {
            if (d.subject !== AQ.subject || sig !== aqFilterSignature()) return;
            d.items.forEach(it => AQ.selected.set(it.id, { qid: it.qid, root: it.is_root }));
            AQ.allMatching = { signature: sig, total: d.total };
            aqRefreshChecks();
            aqUpdateSelectionUI();
        })
        .catch(err => showToast('Could not select all matching rows: ' + aqEsc(err.message), 'danger'))
        .finally(() => { btn.disabled = false; });
}

function aqUpdateSelectionUI() {
    const n = AQ.selected.size;
    const bar = document.getElementById('aqActionBar');
    bar.classList.toggle('d-none', n === 0);
    document.getElementById('aqSelCount').textContent = n;
    document.getElementById('aqSelSubject').textContent = AQ.subject;
    let roots = 0, offPage = 0;
    AQ.selected.forEach((v, id) => { if (v.root) roots++; if (!AQ.nodes.has(id)) offPage++; });
    const parts = [`${roots} question(s)`, `${n - roots} part / stem row(s)`];
    if (offPage) parts.push(`${offPage} not on this page`);
    document.getElementById('aqSelBreakdown').textContent = '· ' + parts.join(' · ');
    const split = document.getElementById('aqSplitItem');
    if (split) split.classList.toggle('disabled', n !== 1);

    const banner = document.getElementById('aqSelectBanner');
    const d = AQ.data;
    const btn = document.getElementById('aqSelectAllMatchingBtn');
    const text = document.getElementById('aqSelectBannerText');
    const sig = aqFilterSignature();
    if (AQ.allMatching && AQ.allMatching.signature === sig) {
        text.innerHTML = `All <strong>${AQ.allMatching.total}</strong> matching rows in <strong>${aqEsc(AQ.subject)}</strong> are selected.`;
        btn.classList.add('d-none');
        banner.classList.remove('d-none');
    } else if (d && aqPageState() === 'all' && d.total_pages > 1) {
        text.innerHTML = `All ${d.items.length} questions on this page are selected, with their parts.`;
        btn.textContent = `Select all ${d.total_matched} matching rows in ${AQ.subject}`;
        btn.classList.remove('d-none');
        banner.classList.remove('d-none');
    } else {
        banner.classList.add('d-none');
    }
}

// ---- row / header shortcuts ----
function aqOpenSmartImportFor(qids) {
    let url = AQ.cfg.urls.smartImport + '?mode=folder';
    if (qids && qids.length) url += '&qids=' + encodeURIComponent(qids.join(','));
    window.open(url, '_blank');
}

function aqOpenSmartImport(selectionOnly) {
    if (!selectionOnly) { aqOpenSmartImportFor([]); return; }
    const qids = Array.from(AQ.selected.values()).map(v => v.qid).filter(Boolean);
    if (!qids.length) { showToast('Select questions first.', 'info'); return; }
    aqOpenSmartImportFor(qids);
}

function aqOpenSplit() {
    if (AQ.selected.size !== 1) {
        showToast('Split works on one standalone question at a time. Select exactly one row, or use its ⋮ menu.', 'warning');
        return;
    }
    window.location.href = `/admin/questions/${Array.from(AQ.selected.keys())[0]}/split`;
}

// Run a bulk op on one row only (from its ⋮ menu), leaving the selection alone.
function aqRowOp(op, id) {
    const node = AQ.nodes.get(id);
    if (!node) return;
    const targets = new Map([[node.id, { qid: node.qid, root: node.parent_id == null }]]);
    aqOpenOp(op, { targets, label: node.qid });
}
</script>
