{# Page header: the subject picker scopes everything below it (ADR-016).
   There is deliberately no "All subjects" option. #}
<div class="d-flex flex-wrap align-items-center justify-content-between aq-header mb-3">
    <div class="d-flex flex-wrap align-items-center gap-3">
        <h4 class="mb-0"><i class="bi bi-journal-text"></i> Question Management</h4>
        <div class="input-group input-group-sm w-auto">
            <span class="input-group-text"><i class="bi bi-book"></i>&nbsp;Subject</span>
            <select class="form-select aq-subject-select" id="aqSubject" aria-label="Subject">
                <option value="" disabled selected>Choose a subject…</option>
                {% for s in subjects %}
                <option value="{{ s.id }}">{{ s.id }} — {{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <span class="text-muted aq-subject-meta" id="aqSubjectMeta"></span>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-sm btn-success" id="aqAddBtn" onclick="showAddModal()" disabled>
            <i class="bi bi-plus-lg"></i> Add question
        </button>
        <button class="btn btn-sm btn-outline-primary" id="aqImportAllBtn" onclick="aqOpenSmartImport(false)"
                title="Import fixed or new image / Word / Markdown files from a server folder">
            <i class="bi bi-folder-plus"></i> Import files
        </button>
        <a href="{{ url_for('admin.index') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Admin
        </a>
    </div>
</div>

{# Hand-off chooser: a dashboard selection / linked QID list that spans subjects. #}
<div id="aqHandoff" class="alert alert-warning d-none py-2 px-3 mb-3">
    <div class="d-flex flex-wrap align-items-center gap-2">
        <i class="bi bi-signpost-split"></i>
        <span id="aqHandoffText"></span>
        <span id="aqHandoffButtons" class="d-flex flex-wrap gap-2"></span>
        <button type="button" class="btn btn-sm btn-link ms-auto" onclick="aqDismissHandoff()">Dismiss</button>
    </div>
</div>
