<script>
// ===================== BULK OPERATION REGISTRY =====================
// Each entry drives one form in ops/*.html through BulkRunner (_js_bulk.html):
//   collect()            -> params from the form
//   validate(p)          -> list of error strings (blocks Review)
//   summary(p)           -> list of HTML lines for the Review stage
//   preview(ids, p)      -> optional async dry run: {html, block}
//   danger(p)            -> 'typed' when the subject code must be typed
//   transport            -> 'json' | 'form' | 'sse'
//   request(ids, p)      -> {url, json} or {url, form} (json/form)
//   sse: {url, params(p)}-> query params added to question_ids + subject_id
//   result(data)         -> {ok, stats: [[label, n, colour]], message, deletedIds}
//   stats                -> SSE stat keys [[key, label, colour]]
// Every request carries subject_id = AQ.subject; the server refuses ids
// outside it (ADR-016).
const opVals = sel => Array.from(document.querySelectorAll(sel + ':checked')).map(cb => cb.value);
const opOn = id => !!(document.getElementById(id) || {}).checked;
const opYes = b => b ? 'yes' : 'no';
const opList = a => a.length ? a.map(aqEsc).join(', ') : '—';

function opIdsForm(ids, extra) {
    const fd = new FormData();
    ids.forEach(id => fd.append('question_ids', id));
    fd.append('subject_id', AQ.subject);
    Object.entries(extra || {}).forEach(([k, v]) => {
        if (Array.isArray(v)) v.forEach(x => fd.append(k, x)); else if (v !== undefined && v !== null) fd.append(k, v);
    });
    return fd;
}

function opQidPreview(qids, max) {
    max = max || 12;
    return qids.slice(0, max).map(q => `<code>${aqEsc(q)}</code>`).join(', ') + (qids.length > max ? `, … (${qids.length})` : '');
}

// ---- AI endpoint picker (shared) ----
const AQ_AI = { loaded: null, endpoints: [], defaults: {} };
const AQ_AI_DEFAULT_KEY = { aiCheck: 'check', aiMd: 'md', aiSolveGen: 'solvegen', aiSolveCheck: 'solvecheck', aiTag: 'tag' };

function opLoadAiEndpoints(opKey) {
    const sel = document.getElementById('opAiEndpoint');
    if (!sel) return;
    const apply = () => {
        const want = AQ_AI.defaults[AQ_AI_DEFAULT_KEY[opKey]];
        const opt = want != null ? sel.querySelector(`option[value="${want}"]`) : null;
        if (opt && !opt.disabled) sel.value = String(want);
        else {
            const first = Array.from(sel.options).find(o => !o.disabled && o.value);
            if (first) sel.value = first.value;
        }
        opAiParallelUI();
    };
    if (AQ_AI.loaded) { apply(); return; }
    sel.innerHTML = '<option value="">Loading…</option>';
    AQ_AI.loaded = fetch(AQ.cfg.urls.aiEndpoints)
        .then(r => r.json())
        .then(d => {
            AQ_AI.endpoints = d.endpoints || [];
            AQ_AI.defaults = d.defaults || {};
            sel.innerHTML = AQ_AI.endpoints.length
                ? AQ_AI.endpoints.map(ep => `<option value="${ep.id}"${ep.supports_vision ? '' : ' disabled'}>${aqEsc(ep.name)} — ${aqEsc(ep.model_name)}${ep.supports_vision ? '' : ' (text-only, not usable)'}</option>`).join('')
                : '<option value="">No endpoints configured</option>';
            apply();
        })
        .catch(() => { sel.innerHTML = '<option value="">Could not load endpoints</option>'; AQ_AI.loaded = null; });
}

function opAiParallelUI() {
    const sel = document.getElementById('opAiEndpoint');
    const wrap = document.getElementById('opAiParallelWrap');
    if (!sel || !wrap) return;
    const ep = AQ_AI.endpoints.find(e => String(e.id) === String(sel.value));
    const cloud = !!(ep && ep.kind === 'cloud' && (ep.max_concurrency || 1) > 1);
    wrap.classList.toggle('d-none', !cloud);
    if (cloud) document.getElementById('opAiParallelHint').textContent = `(up to ${ep.max_concurrency} at once)`;
}

function opAiCommon() {
    const sel = document.getElementById('opAiEndpoint');
    const ep = AQ_AI.endpoints.find(e => String(e.id) === String(sel.value));
    const parallel = !document.getElementById('opAiParallelWrap').classList.contains('d-none') && opOn('opAiParallel');
    return { endpoint_id: sel.value, endpoint_name: ep ? `${ep.name} — ${ep.model_name}` : '', parallel };
}

function opAiValidate(p) { return p.endpoint_id ? [] : ['Pick a vision-capable LLM endpoint.']; }
function opAiParams(p) { const o = { endpoint_id: p.endpoint_id }; if (p.parallel) o.parallel = '1'; return o; }
function opAiSummary(p) { return [`Endpoint: <strong>${aqEsc(p.endpoint_name)}</strong>${p.parallel ? ' (parallel)' : ''}`]; }

// ---- check state ----
function opCsStateChanged() {
    const s = document.getElementById('opCsState').value;
    document.getElementById('opCsSeverityWrap').classList.toggle('d-none', s !== 'issues');
    document.getElementById('opCsNoteWrap').classList.toggle('d-none', !(s === 'issues' || s === 'error'));
}

// ---- IMG defaults from System Settings (super-admin only; silent otherwise) ----
let opImgDefaultsLoaded = false;
function opLoadImgDefaults() {
    if (opImgDefaultsLoaded || !AQ.cfg.isSuperAdmin) return;
    opImgDefaultsLoaded = true;
    fetch(AQ.cfg.urls.settingsData)
        .then(r => r.ok ? r.json() : null)
        .then(d => {
            if (!d) return;
            const reg = d.registry || {};
            const v = k => (reg[k] || {}).value;
            document.getElementById('opImgWidth').value = v('BATCH_IMG_DEFAULT_WIDTH') || v('DOC_THUMBNAIL_WIDTH') || '';
            document.getElementById('opImgTransparent').checked = !!v('THUMBNAIL_TRANSPARENT');
            document.getElementById('opImgSymmetric').checked = !!v('THUMBNAIL_SYMMETRIC_HORIZONTAL_CROP');
            const stitch = v('BATCH_IMG_DEFAULT_STITCH');
            document.getElementById(stitch === false ? 'opImgStitch0' : 'opImgStitch1').checked = true;
        })
        .catch(() => { /* keep the form defaults */ });
}

// ---- copy / move cards ----
let opAssetOpsNextId = 1;
function opBaoChoices(opId, side, axis, values, labels, defaults) {
    const want = new Set(defaults);
    return values.map(v => `
        <div class="form-check">
            <input class="form-check-input bao-${side}-${axis}" type="checkbox" value="${v}" id="bao_${opId}_${side}_${axis}_${v}"${want.has(v) ? ' checked' : ''}>
            <label class="form-check-label" for="bao_${opId}_${side}_${axis}_${v}">${labels[v] || v}</label>
        </div>`).join('');
}

function opBaoCardHtml(opId) {
    const vl = {};
    AQ_VERSIONS.forEach(v => { vl[v] = v + ((window.OQB_VERSION_LABELS || {})[v] ? ` <small class="text-muted">${window.OQB_VERSION_LABELS[v]}</small>` : ''); });
    const side = (s, title, icon, verDefaults) => `
        <div class="col-md-6"><div class="border rounded p-2 h-100">
            <div class="fw-semibold small mb-1"><i class="bi ${icon}"></i> ${title}</div>
            <div class="row g-1">
                <div class="col-5"><div class="aq-filter-label">Versions</div>${opBaoChoices(opId, s, 'version', AQ_VERSIONS, vl, verDefaults)}</div>
                <div class="col-4"><div class="aq-filter-label">Types</div>${opBaoChoices(opId, s, 'atype', AQ_ATYPES, {}, AQ_ATYPES)}</div>
                <div class="col-3"><div class="aq-filter-label">Formats</div>${opBaoChoices(opId, s, 'format', AQ_FORMATS, {}, ['IMG'])}</div>
            </div>
        </div></div>`;
    return `
        <div class="card mb-2 bao-card" data-op-id="${opId}">
            <div class="card-header py-1 d-flex flex-wrap align-items-center gap-2">
                <strong class="small">Step <span class="bao-n"></span></strong>
                <select class="form-select form-select-sm w-auto bao-action" title="Copy keeps the source; Move removes it after every target succeeds">
                    <option value="copy">Copy</option><option value="move">Move</option>
                </select>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input bao-overwrite" type="checkbox" id="bao_${opId}_overwrite">
                    <label class="form-check-label small" for="bao_${opId}_overwrite">Overwrite targets</label>
                </div>
                <div class="btn-group btn-group-sm ms-auto">
                    <button type="button" class="btn btn-outline-secondary" onclick="opAssetOpsMove(${opId}, -1)" title="Up"><i class="bi bi-arrow-up"></i></button>
                    <button type="button" class="btn btn-outline-secondary" onclick="opAssetOpsMove(${opId}, 1)" title="Down"><i class="bi bi-arrow-down"></i></button>
                    <button type="button" class="btn btn-outline-danger" onclick="opAssetOpsRemove(${opId})" title="Remove"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
            <div class="card-body py-2"><div class="row g-2">
                ${side('src', 'From', 'bi-box-arrow-up-right', ['ENO'])}
                ${side('tgt', 'To', 'bi-box-arrow-in-down-right', ['EN', 'BI'])}
            </div></div>
        </div>`;
}

function opAssetOpsRenumber() {
    document.querySelectorAll('#opAssetOpsList .bao-card').forEach((c, i) => { c.querySelector('.bao-n').textContent = i + 1; });
}

function opBaoLocks(card) {
    ['version', 'atype'].forEach(axis => {
        const src = Array.from(card.querySelectorAll(`.bao-src-${axis}:checked`)).map(cb => cb.value);
        const locked = src.length > 1;
        card.querySelectorAll(`.bao-tgt-${axis}`).forEach(cb => {
            if (locked) cb.checked = src.includes(cb.value);
            cb.disabled = locked;
            cb.closest('.form-check').classList.toggle('opacity-50', locked);
        });
    });
}

function opAssetOpsAdd() {
    const id = opAssetOpsNextId++;
    document.getElementById('opAssetOpsList').insertAdjacentHTML('beforeend', opBaoCardHtml(id));
    opBaoLocks(document.querySelector(`#opAssetOpsList .bao-card[data-op-id="${id}"]`));
    opAssetOpsRenumber();
}

function opAssetOpsRemove(id) {
    document.querySelector(`#opAssetOpsList .bao-card[data-op-id="${id}"]`)?.remove();
    opAssetOpsRenumber();
}

function opAssetOpsMove(id, delta) {
    const card = document.querySelector(`#opAssetOpsList .bao-card[data-op-id="${id}"]`);
    if (!card) return;
    if (delta < 0 && card.previousElementSibling) card.parentNode.insertBefore(card, card.previousElementSibling);
    else if (delta > 0 && card.nextElementSibling) card.parentNode.insertBefore(card.nextElementSibling, card);
    opAssetOpsRenumber();
}

document.addEventListener('change', e => {
    if (e.target && e.target.matches('.bao-src-version, .bao-src-atype')) opBaoLocks(e.target.closest('.bao-card'));
});

function opAssetOpsCollect() {
    const vals = (card, sel) => Array.from(card.querySelectorAll(sel + ':checked')).map(cb => cb.value);
    return Array.from(document.querySelectorAll('#opAssetOpsList .bao-card')).map(card => ({
        action: card.querySelector('.bao-action').value,
        source_versions: vals(card, '.bao-src-version'),
        source_atypes: vals(card, '.bao-src-atype'),
        source_formats: vals(card, '.bao-src-format'),
        target_versions: vals(card, '.bao-tgt-version'),
        target_atypes: vals(card, '.bao-tgt-atype'),
        target_formats: vals(card, '.bao-tgt-format'),
        overwrite: card.querySelector('.bao-overwrite').checked,
    }));
}

// ---- the registry ----
const AQ_OPS = {
    verified: {
        title: 'Set verified', icon: 'bi-patch-check',
        intro: 'Sets the whole-question <strong>Verified</strong> flag on every selected row.',
        transport: 'json',
        collect: () => ({ verified: opOn('opVerifiedYes') }),
        summary: p => [`Mark every row <strong>${p.verified ? 'verified' : 'not verified'}</strong>.`],
        runLabel: (p, n) => `Mark ${n} ${p.verified ? 'verified' : 'not verified'}`,
        request: (ids, p) => ({ url: AQ.cfg.urls.verified, json: { question_ids: ids, verified: p.verified, subject_id: AQ.subject } }),
        result: d => ({ ok: !!d.success, stats: [['Updated', d.updated, 'success']], message: d.error }),
    },
    checkState: {
        title: 'Set proofread state', icon: 'bi-clipboard-check',
        intro: 'Writes a manual proofread state on the chosen asset slots of every selected row.',
        transport: 'json',
        onOpen: () => opCsStateChanged(),
        collect: () => ({
            versions: opVals('.op-cs-version'), atypes: opVals('.op-cs-atype'),
            state: document.getElementById('opCsState').value,
            severity: document.getElementById('opCsSeverity').value,
            note: document.getElementById('opCsNote').value.trim(),
            overwrite: opOn('opCsOverwrite'),
        }),
        validate: p => [!p.versions.length && 'Pick at least one version.', !p.atypes.length && 'Pick at least one asset type.'].filter(Boolean),
        summary: p => [
            `State: <strong>${aqEsc(document.querySelector('#opCsState option:checked').textContent)}</strong>${p.state === 'issues' ? ` (${aqEsc(p.severity)})` : ''}`,
            `Slots: ${opList(p.versions)} × ${opList(p.atypes)}`,
            `Overwrite existing states: ${opYes(p.overwrite || p.state === 'clear')}`,
        ],
        request: (ids, p) => ({ url: AQ.cfg.urls.checkState, json: Object.assign({ question_ids: ids, subject_id: AQ.subject }, p) }),
        result: d => ({ ok: !!d.success, stats: [['Slots', d.slots_updated, 'success'], ['Assets', d.assets_updated, 'info']], message: d.error || d.message }),
    },
    img: {
        title: 'Generate IMG', icon: 'bi-image',
        intro: 'Renders DOC / MD sources to PNG with Microsoft Word on the server, one slot at a time.',
        transport: 'sse',
        onOpen: () => opLoadImgDefaults(),
        collect: () => ({
            types: opVals('.op-img-type'), versions: opVals('.op-img-version'), sources: opVals('.op-img-src'),
            stitch: (document.querySelector('input[name="opImgStitch"]:checked') || {}).value || '1',
            overwrite: opOn('opImgOverwrite'), width: document.getElementById('opImgWidth').value.trim(),
            transparent: opOn('opImgTransparent'), symmetric: opOn('opImgSymmetric'),
        }),
        validate: p => [!p.types.length && 'Pick at least one asset type.', !p.versions.length && 'Pick at least one version.',
                        !p.sources.length && 'Pick at least one source format.'].filter(Boolean),
        summary: p => [
            `Render ${opList(p.types)} for ${opList(p.versions)} from ${p.sources.join(' → ')}`,
            `${p.stitch === '1' ? 'One stitched PNG' : 'One PNG per page'}, width ${aqEsc(p.width || 'system default')}`,
            `Replace existing IMG: <strong>${opYes(p.overwrite)}</strong>`,
        ],
        sse: {
            url: () => AQ.cfg.urls.img,
            params: p => {
                const o = { types: p.types.join(','), versions: p.versions.join(','), sources: p.sources.join(','), stitch: p.stitch,
                            overwrite: p.overwrite ? '1' : '0', transparent: p.transparent ? '1' : '0', symmetric_horizontal: p.symmetric ? '1' : '0' };
                if (p.width) o.width = p.width;
                return o;
            },
        },
        stats: [['rendered', 'Rendered', 'success'], ['skipped_no_src', 'No source', 'secondary'], ['skipped_has_img', 'IMG exists', 'secondary'], ['failed', 'Failed', 'danger']],
    },
    mcq: {
        title: 'Set MCQ ANS images', icon: 'bi-check-circle',
        intro: 'Copies the A / B / C / D answer image for MC questions whose Answer tag is a single letter.',
        transport: 'sse',
        collect: () => ({ versions: opVals('.op-mcq-version'), overwrite: opOn('opMcqOverwrite') }),
        validate: p => [!p.versions.length && 'Pick at least one version.'].filter(Boolean),
        summary: p => [`Versions: ${opList(p.versions)}`, `Replace an existing ANS image: <strong>${opYes(p.overwrite)}</strong>`],
        sse: { url: () => AQ.cfg.urls.mcq, params: p => ({ versions: p.versions.join(','), overwrite: p.overwrite ? '1' : '0' }) },
        stats: [['success', 'Set', 'success'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    assetOps: {
        title: 'Copy / move assets', icon: 'bi-files',
        intro: 'Copies or moves asset files between version / type slots for every selected row. Steps run in order.',
        transport: 'sse',
        onOpen: () => { if (!document.querySelector('#opAssetOpsList .bao-card')) opAssetOpsAdd(); },
        collect: () => ({ ops: opAssetOpsCollect() }),
        validate: p => {
            const errs = [];
            if (!p.ops.length) errs.push('Add at least one step.');
            p.ops.forEach((o, i) => {
                const pre = `Step ${i + 1}`;
                ['source_versions', 'source_atypes', 'source_formats', 'target_versions', 'target_atypes', 'target_formats'].forEach(k => {
                    if (!o[k].length) errs.push(`${pre}: pick at least one ${k.replace('_', ' ').replace('atypes', 'asset type').replace(/s$/, '')}.`);
                });
                if (!o.source_formats.some(f => o.target_formats.includes(f))) errs.push(`${pre}: source and target formats must overlap (no conversion).`);
            });
            if (JSON.stringify(p.ops).length > 3000) errs.push('Too many steps for one request; remove a few.');
            return errs;
        },
        summary: p => p.ops.map((o, i) =>
            `Step ${i + 1}: <strong>${o.action}</strong> ${opList(o.source_versions)} ${opList(o.source_atypes)} ${opList(o.source_formats)}
             → ${opList(o.target_versions)} ${opList(o.target_atypes)} ${opList(o.target_formats)}${o.overwrite ? ' <span class="text-danger">(overwrite)</span>' : ''}`),
        danger: p => p.ops.some(o => o.action === 'move' || o.overwrite) ? 'typed' : null,
        dangerText: 'Move removes the source files and overwrite replaces existing targets.',
        sse: { url: () => AQ.cfg.urls.assetOps, params: p => ({ ops: JSON.stringify(p.ops) }) },
        stats: [['copied', 'Copied', 'success'], ['moved', 'Moved', 'success'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    deleteAssets: {
        title: 'Delete assets', icon: 'bi-file-earmark-x', destructive: true,
        intro: 'Removes the assets that match <strong>format × version × type</strong>. The questions stay.',
        transport: 'form',
        collect: () => ({ formats: opVals('.op-da-format'), versions: opVals('.op-da-version'), atypes: opVals('.op-da-atype'), files: opOn('opDaFiles') }),
        validate: p => [!p.formats.length && 'Pick at least one format.', !p.versions.length && 'Pick at least one version.',
                        !p.atypes.length && 'Pick at least one asset type.'].filter(Boolean),
        summary: p => [
            `Delete ${opList(p.formats)} assets of ${opList(p.versions)} × ${opList(p.atypes)}`,
            p.files ? '<span class="text-danger">Files are deleted from disk too.</span>' : 'Files stay on disk (database rows only).',
        ],
        preview: (ids, p) => fetch(AQ.cfg.urls.deleteAssets, {
            method: 'POST',
            body: opIdsForm(ids, { formats: p.formats, versions: p.versions, atypes: p.atypes, dry_run: 'true' }),
        }).then(r => r.json()).then(d => {
            if (!d.success) return { html: `<span class="text-danger">${aqEsc(d.error || 'Dry run failed')}</span>`, block: true };
            if (!d.count) return { html: 'No asset matches these choices — nothing would be deleted.', block: true };
            return { html: `<strong>${d.count}</strong> asset(s) on <strong>${d.questions_touched}</strong> row(s) will be deleted.` };
        }),
        danger: () => 'typed',
        runLabel: (p, n) => 'Delete assets',
        request: (ids, p) => ({ url: AQ.cfg.urls.deleteAssets, form: opIdsForm(ids, {
            formats: p.formats, versions: p.versions, atypes: p.atypes, delete_files: p.files ? 'true' : 'false' }) }),
        result: d => ({ ok: !!d.success, stats: [['Assets deleted', d.deleted_count, 'danger'], ['Files deleted', d.files_deleted, 'secondary'], ['Rows touched', d.questions_touched, 'info']],
                        message: d.error || d.message }),
    },
    aiCheck: {
        title: 'AI proofread', icon: 'bi-search', ai: true,
        intro: 'Compares a typed version against the official scan and stores the result on each asset.',
        transport: 'sse',
        collect: () => Object.assign(opAiCommon(), {
            typed: document.getElementById('opAiCheckTyped').value, ref: document.getElementById('opAiCheckRef').value,
            atypes: opVals('.op-aicheck-atype'), formats: opVals('.op-aicheck-format'), recheck: opOn('opAiCheckRecheck'),
        }),
        validate: p => opAiValidate(p).concat([p.typed === p.ref && 'Typed and reference versions must differ.',
            !p.atypes.length && 'Pick at least one asset type.', !p.formats.length && 'Pick at least one format.'].filter(Boolean)),
        summary: p => opAiSummary(p).concat([`Check ${aqEsc(p.typed)} against ${aqEsc(p.ref)} · ${opList(p.atypes)} · ${opList(p.formats)}`,
            `Re-check slots already checked: ${opYes(p.recheck)}`]),
        sse: { url: () => AQ.cfg.urls.aiCheck, params: p => Object.assign(opAiParams(p), {
            atypes: p.atypes.join(','), typed_version: p.typed, ref_version: p.ref, recheck: p.recheck ? '1' : '0', formats: p.formats.join(',') }) },
        stats: [['ok', 'OK', 'success'], ['issues', 'Issues', 'warning'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    aiMd: {
        title: 'AI generate Markdown', icon: 'bi-markdown', ai: true,
        intro: 'Transcribes image assets into Markdown assets.',
        transport: 'sse',
        collect: () => Object.assign(opAiCommon(), {
            source: document.getElementById('opAiMdSource').value, target: document.getElementById('opAiMdTarget').value,
            atypes: opVals('.op-aimd-atype'), embed: opOn('opAiMdEmbed'), overwrite: opOn('opAiMdOverwrite'),
        }),
        validate: p => opAiValidate(p).concat([!p.atypes.length && 'Pick at least one asset type.'].filter(Boolean)),
        summary: p => opAiSummary(p).concat([`${aqEsc(p.source)} images → ${aqEsc(p.target)} Markdown · ${opList(p.atypes)}`,
            `Embed figures: ${opYes(p.embed)} · Overwrite existing Markdown: <strong>${opYes(p.overwrite)}</strong>`]),
        sse: { url: () => AQ.cfg.urls.aiMd, params: p => Object.assign(opAiParams(p), {
            atypes: p.atypes.join(','), source_version: p.source, target_version: p.target,
            embed_image: p.embed ? '1' : '0', overwrite: p.overwrite ? '1' : '0' }) },
        stats: [['created', 'Created / updated', 'success'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    aiSolveGen: {
        title: 'AI generate ANS / SOL', icon: 'bi-lightbulb', ai: true,
        intro: 'The model solves each question and writes answer / solution Markdown (and optionally the ANS text).',
        transport: 'sse',
        collect: () => Object.assign(opAiCommon(), {
            versions: opVals('.op-solvegen-version'), targets: opVals('.op-solvegen-target'),
            official: opOn('opSolveGenOfficial'), overwrite: opOn('opSolveGenOverwrite'),
        }),
        validate: p => opAiValidate(p).concat([!p.versions.length && 'Pick at least one target version.',
            !p.targets.length && 'Pick at least one thing to generate.'].filter(Boolean)),
        summary: p => opAiSummary(p).concat([`Generate ${opList(p.targets)} for ${opList(p.versions)}`,
            `Send official SOL: ${opYes(p.official)} · Overwrite existing: <strong>${opYes(p.overwrite)}</strong>`]),
        sse: { url: () => AQ.cfg.urls.aiSolveGen, params: p => Object.assign(opAiParams(p), {
            versions: p.versions.join(','), targets: p.targets.join(','),
            include_official_sol: p.official ? '1' : '0', overwrite: p.overwrite ? '1' : '0' }) },
        stats: [['created', 'Created', 'success'], ['updated', 'Updated', 'info'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    aiSolveCheck: {
        title: 'AI check ANS / SOL', icon: 'bi-clipboard2-check', ai: true,
        intro: 'The model checks existing answers and solutions; findings go to each asset\'s proofread state.',
        transport: 'sse',
        collect: () => Object.assign(opAiCommon(), {
            versions: opVals('.op-solvecheck-version'), targets: opVals('.op-solvecheck-target'),
            formats: opVals('.op-solvecheck-format'), official: opOn('opSolveCheckOfficial'),
        }),
        validate: p => opAiValidate(p).concat([!p.versions.length && 'Pick at least one version.',
            !p.targets.length && 'Pick at least one thing to check.',
            !p.formats.length && p.targets.some(t => t !== 'ANS_TEXT') && 'Pick at least one format.'].filter(Boolean)),
        summary: p => opAiSummary(p).concat([`Check ${opList(p.targets)} for ${opList(p.versions)} · ${opList(p.formats)}`,
            `Send official SOL: ${opYes(p.official)}`]),
        sse: { url: () => AQ.cfg.urls.aiSolveCheck, params: p => Object.assign(opAiParams(p), {
            versions: p.versions.join(','), targets: p.targets.join(','), formats: p.formats.join(','),
            include_official_sol: p.official ? '1' : '0' }) },
        stats: [['ok', 'OK', 'success'], ['issues', 'Issues', 'warning'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    aiTag: {
        title: 'AI auto-tag', icon: 'bi-tags', ai: true,
        intro: 'Classifies each question and writes the chosen tags. A restore point is saved first.',
        transport: 'sse',
        collect: () => Object.assign(opAiCommon(), {
            versions: opVals('.op-tag-version'), fields: opVals('.op-tag-field'), overwrite: opOn('opTagOverwrite'),
        }),
        validate: p => opAiValidate(p).concat([!p.versions.length && 'Pick at least one version to send.',
            !p.fields.length && 'Pick at least one tag field.'].filter(Boolean)),
        summary: p => opAiSummary(p).concat([`Write ${opList(p.fields)} (sending ${opList(p.versions)})`,
            p.overwrite ? '<span class="text-danger">Existing tag values are overwritten.</span>' : 'Only empty fields are filled.']),
        danger: p => p.overwrite ? 'typed' : null,
        dangerText: 'Overwrite replaces tags teachers may have set by hand (Admin → Restore Points can undo it).',
        sse: { url: () => AQ.cfg.urls.aiTag, params: p => Object.assign(opAiParams(p), {
            fields: p.fields.join(','), versions: p.versions.join(','), overwrite: p.overwrite ? '1' : '0' }) },
        stats: [['tagged', 'Tagged', 'success'], ['skipped', 'Skipped', 'secondary'], ['errors', 'Errors', 'danger']],
    },
    combine: {
        title: 'Combine parts', icon: 'bi-intersect', destructive: true,
        intro: 'Folds the parts of each selected stem back into one question. The part rows are deleted.',
        transport: 'json',
        collect: () => ({ stitch: opOn('opCombineStitch'), save_whole: opOn('opCombineSaveWhole') }),
        summary: p => ['Each selected stem is combined; selected rows that are not stems are skipped.',
            `Stitch images: ${opYes(p.stitch)} · Save a whole archive when missing: ${opYes(p.save_whole)}`],
        danger: () => 'typed',
        dangerText: 'Part rows (and their tags) are deleted. Split can rebuild parts, but not their tags.',
        runLabel: () => 'Combine',
        request: (ids, p) => ({ url: AQ.cfg.urls.combine, json: { ids, stitch: p.stitch, save_whole: p.save_whole, subject_id: AQ.subject } }),
        result: d => {
            const res = d.results || [];
            const good = res.filter(x => x.ok), bad = res.filter(x => !x.ok);
            const deleted = [];
            good.forEach(x => (x.deleted_ids || []).forEach(id => deleted.push(id)));
            return {
                ok: !d.error && !bad.length,
                stats: [['Combined', good.length, 'success'], ['Failed', bad.length, 'danger']],
                message: d.error,
                lines: res.map(x => [x.ok ? 'success' : 'error', `${x.qid || x.id}: ${x.ok ? 'combined' : (x.error || 'failed')}`]),
                deletedIds: deleted,
            };
        },
    },
    deleteQuestions: {
        title: 'Delete questions', icon: 'bi-trash', destructive: true,
        intro: 'Deletes the selected question rows and all their assets.',
        transport: 'form',
        collect: () => ({ children: opOn('opDqChildren'), emptyParents: opOn('opDqEmptyParents'), files: opOn('opDqFiles') }),
        summary: p => [
            `Delete the selected rows${p.children ? ' and every part under them' : ''}.`,
            p.emptyParents ? 'Parent rows left without parts are deleted too.' : 'Parent rows left without parts are kept.',
            p.files ? '<span class="text-danger">Asset files are deleted from disk.</span>' : 'Asset files stay on disk.',
        ],
        preview: (ids, p) => fetch(AQ.cfg.urls.delete, {
            method: 'POST', body: opIdsForm(ids, { delete_children: p.children ? 'true' : undefined, dry_run: 'true' }),
        }).then(r => r.json().then(d => ({ status: r.status, d }))).then(({ status, d }) => {
            if (status === 409) {
                return { block: true, html: `<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> ${aqEsc(d.error)}</span>
                    <div class="mt-1">Unselected parts: ${opQidPreview(d.blocking_qids || [])}</div>
                    <div class="mt-1">Go back and tick <em>Also delete child parts that are not selected</em>, or select those parts too.</div>` };
            }
            if (!d.success) return { block: true, html: `<span class="text-danger">${aqEsc(d.error || 'Dry run failed')}</span>` };
            const empty = d.empty_parent_qids || [], archives = d.archive_qids || [];
            const total = d.count + (p.emptyParents ? empty.length : 0);
            let html = `<div><strong>${total}</strong> row(s) will be deleted.</div>`;
            if (empty.length) html += `<div class="mt-1">${p.emptyParents ? 'Includes' : 'Left behind'} ${empty.length} parent row(s) with no parts: ${opQidPreview(empty)}</div>`;
            if (archives.length && p.emptyParents) html += `<div class="mt-1 text-danger"><i class="bi bi-archive"></i> Their whole-question images are deleted too: ${opQidPreview(archives)}</div>`;
            return { html, total };
        }),
        danger: () => 'typed',
        runLabel: (p, n, pre) => `Delete ${pre && pre.total ? pre.total : n} row(s)`,
        request: (ids, p) => ({ url: AQ.cfg.urls.delete, form: opIdsForm(ids, {
            delete_files: p.files ? 'true' : undefined, delete_children: p.children ? 'true' : undefined,
            delete_empty_parents: p.emptyParents ? 'true' : undefined }) }),
        result: d => {
            const left = (d.left_empty_qids || []).length;
            let message = d.error || '';
            if (d.blocking_qids && d.blocking_qids.length) message += ' (' + d.blocking_qids.slice(0, 8).join(', ') + (d.blocking_qids.length > 8 ? ', …' : '') + ')';
            return {
                ok: !!d.success,
                stats: [['Deleted', d.deleted_count, 'danger'], ['Files deleted', d.files_deleted, 'secondary'], ['Empty parents kept', left, 'secondary']],
                message: message || d.message,
                deletedIds: d.deleted_ids || [],
            };
        },
        after: res => { if (res.deletedIds && res.deletedIds.length) aqForgetDashboardSelection(res.deletedIds); },
    },
};

// Drop deleted ids from the dashboard selection so it stops counting them.
function aqForgetDashboardSelection(deletedIds) {
    try {
        const gone = new Set(deletedIds.map(String));
        const kept = aqDashboardIds().filter(id => !gone.has(String(id)));
        localStorage.setItem('oqb_selectedQuestions', JSON.stringify(kept));
        document.getElementById('aqDashSelCount').textContent = kept.length;
    } catch (e) { /* storage unavailable */ }
}
</script>
