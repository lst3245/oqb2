<div class="bp-op d-none" data-op="aiMd">
    <div class="row g-3">
        <div class="col-sm-6">
            <div class="bp-section-title">{{ t('Source version (image)') }}</div>
            <select class="form-select form-select-sm" id="opAiMdSource">
                {% for v in OQB_VERSIONS %}<option value="{{ v }}"{% if v == 'EN' %} selected{% endif %}>{{ v }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-sm-6">
            <div class="bp-section-title">{{ t('Target version (Markdown)') }}</div>
            <select class="form-select form-select-sm" id="opAiMdTarget">
                {% for v in OQB_VERSIONS %}<option value="{{ v }}"{% if v == 'EN' %} selected{% endif %}>{{ v }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div class="bp-section-title">{{ t('Asset types') }}</div>
    <div class="d-flex gap-3">
        {% for code in ['QUE', 'ANS', 'SOL'] %}
        <div class="form-check">
            <input class="form-check-input op-aimd-atype" type="checkbox" value="{{ code }}" id="opAiMdType_{{ code }}"{% if code == 'QUE' %} checked{% endif %}>
            <label class="form-check-label" for="opAiMdType_{{ code }}">{{ code }}</label>
        </div>
        {% endfor %}
    </div>
    <div class="form-check form-switch mt-3">
        <input class="form-check-input" type="checkbox" id="opAiMdEmbed" checked>
        <label class="form-check-label" for="opAiMdEmbed">{{ t('Embed figures (cropped when possible) when the question has a diagram') }}</label>
    </div>
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="opAiMdOverwrite">
        <label class="form-check-label" for="opAiMdOverwrite">{{ t('Overwrite an existing target Markdown') }}</label>
    </div>
</div>
