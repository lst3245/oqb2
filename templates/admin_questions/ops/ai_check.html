<div class="bp-op d-none" data-op="aiCheck">
    <div class="row g-3">
        <div class="col-sm-6">
            <div class="bp-section-title">Typed version (to check)</div>
            <select class="form-select form-select-sm" id="opAiCheckTyped">
                {% for v in OQB_VERSIONS %}<option value="{{ v }}"{% if v == 'EN' %} selected{% endif %}>{{ v }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-sm-6">
            <div class="bp-section-title">Reference (official)</div>
            <select class="form-select form-select-sm" id="opAiCheckRef">
                {% for v in OQB_VERSIONS %}<option value="{{ v }}"{% if v == 'ENO' %} selected{% endif %}>{{ v }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-sm-6">
            <div class="bp-section-title">Asset types</div>
            <div class="d-flex gap-3">
                {% for t in ['QUE', 'ANS', 'SOL'] %}
                <div class="form-check">
                    <input class="form-check-input op-aicheck-atype" type="checkbox" value="{{ t }}" id="opAiCheckType_{{ t }}"{% if t == 'QUE' %} checked{% endif %}>
                    <label class="form-check-label" for="opAiCheckType_{{ t }}">{{ t }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="col-sm-6">
            <div class="bp-section-title">Formats</div>
            <div class="d-flex gap-3">
                {% for f in ['IMG', 'MD', 'DOC'] %}
                <div class="form-check">
                    <input class="form-check-input op-aicheck-format" type="checkbox" value="{{ f }}" id="opAiCheckFmt_{{ f }}" checked>
                    <label class="form-check-label" for="opAiCheckFmt_{{ f }}">{{ f }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class="form-check form-switch mt-3">
        <input class="form-check-input" type="checkbox" id="opAiCheckRecheck">
        <label class="form-check-label" for="opAiCheckRecheck">Re-check slots already checked</label>
    </div>
    <div class="form-text">Each format in a slot is proofread on its own; MD and DOCX are rendered to images first. Results are stored on each asset.</div>
</div>
