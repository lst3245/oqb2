<div class="bp-op d-none" data-op="verified">
    <div class="bp-section-title">{{ t('New value') }}</div>
    <div class="btn-group w-100" role="group">
        <input type="radio" class="btn-check" name="opVerifiedValue" id="opVerifiedYes" value="1" checked>
        <label class="btn btn-outline-success" for="opVerifiedYes"><i class="bi bi-patch-check-fill"></i> {{ t('Verified') }}</label>
        <input type="radio" class="btn-check" name="opVerifiedValue" id="opVerifiedNo" value="0">
        <label class="btn btn-outline-secondary" for="opVerifiedNo"><i class="bi bi-shield"></i> {{ t('Not verified') }}</label>
    </div>
    <div class="form-text">{{ t('Verified is a whole-question flag. Marking a question verified records you and the time.') }}</div>
</div>
