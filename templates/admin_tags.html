{% extends "base.html" %}

{% block title %}Tag Questions - Question Bank{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h2><i class="bi bi-pencil-square"></i> Tag Questions</h2>
    <hr>
    
    <!-- Filter -->
    <div class="card mb-3">
        <div class="card-body">
            <form id="filterForm" hx-post="{{ url_for('admin.filter_questions_for_tagging') }}" 
                  hx-target="#questionTagList">
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Subject</label>
                        <select class="form-select" name="subject" id="subjectSelect">
                            <option value="">All</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Source</label>
                        <select class="form-select" name="source">
                            <option value="all">All</option>
                            <option value="DSE">DSE</option>
                            <option value="CE">CE</option>
                            <option value="AL">AL</option>
                            <option value="QB">Question Bank</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Filter
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Questions List -->
    <div id="questionTagList">
        {% include 'partials/question_tag_list.html' %}
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit Question Tags</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editQuestionId">
                    
                    <div class="mb-3">
                        <label class="form-label">Level</label>
                        <select class="form-select" id="editLevel" name="level">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Question Type</label>
                        <select class="form-select" id="editQType" name="q_type">
                            <option value="MC">Multiple Choice</option>
                            <option value="CQ">Conventional Question</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Section</label>
                        <input type="text" class="form-control" id="editSection" name="section" 
                               placeholder="A, B, or leave empty">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Major Topic</label>
                        <select class="form-select" id="editMajorTopic" name="major_topic_id">
                            <option value="">None</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Minor Topics</label>
                        <select class="form-select" id="editMinorTopics" name="minor_topic_ids" multiple size="5">
                        </select>
                        <small class="text-muted">Hold Ctrl to select multiple</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Subtopics</label>
                        <select class="form-select" id="editSubtopics" name="subtopic_ids" multiple size="5">
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveQuestionTags()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Preview Modal -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previewModalLabel">Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="previewModalBody">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let editModal, previewModal;

document.addEventListener('DOMContentLoaded', function() {
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
    previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
});

// Subject change - load topics
document.getElementById('subjectSelect').addEventListener('change', function() {
    const subjectId = this.value;
    if (subjectId) {
        loadTopicsForSubject(subjectId);
    }
});

function loadTopicsForSubject(subjectId) {
    fetch(`{{ url_for('dashboard.get_topics', subject_id='') }}${subjectId}`)
        .then(r => r.json())
        .then(topics => {
            const majorSelect = document.getElementById('editMajorTopic');
            const minorSelect = document.getElementById('editMinorTopics');
            
            const options = topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            majorSelect.innerHTML = '<option value="">None</option>' + options;
            minorSelect.innerHTML = options;
        });
}

function editQuestion(questionId, questionData) {
    document.getElementById('editQuestionId').value = questionId;
    document.getElementById('editModalLabel').textContent = `Edit ${questionData.qid}`;
    
    // Load topics for this question's subject
    loadTopicsForSubject(questionData.subject);
    
    // Set values
    document.getElementById('editLevel').value = questionData.level;
    document.getElementById('editQType').value = questionData.q_type;
    document.getElementById('editSection').value = questionData.section || '';
    
    // Set major topic (after topics load)
    setTimeout(() => {
        document.getElementById('editMajorTopic').value = questionData.major_topic_id || '';
        
        // Set minor topics
        const minorSelect = document.getElementById('editMinorTopics');
        Array.from(minorSelect.options).forEach(opt => {
            opt.selected = questionData.minor_topic_ids.includes(parseInt(opt.value));
        });
        
        // Load and set subtopics
        if (questionData.major_topic_id) {
            loadSubtopics([questionData.major_topic_id, ...questionData.minor_topic_ids], 
                         questionData.subtopic_ids);
        }
    }, 500);
    
    editModal.show();
}

function loadSubtopics(topicIds, selectedSubtopicIds = []) {
    const topicIdsStr = topicIds.filter(id => id).join(',');
    if (!topicIdsStr) return;
    
    fetch(`{{ url_for('dashboard.get_subtopics') }}?topic_ids=${topicIdsStr}`)
        .then(r => r.json())
        .then(subtopics => {
            const subtopicSelect = document.getElementById('editSubtopics');
            subtopicSelect.innerHTML = subtopics.map(s => 
                `<option value="${s.id}">${s.name}</option>`
            ).join('');
            
            // Select previously selected subtopics
            Array.from(subtopicSelect.options).forEach(opt => {
                opt.selected = selectedSubtopicIds.includes(parseInt(opt.value));
            });
        });
}

function saveQuestionTags() {
    const questionId = document.getElementById('editQuestionId').value;
    const formData = new FormData(document.getElementById('editForm'));
    
    fetch(`{{ url_for('admin.update_question', question_id=0) }}`.replace('0', questionId), {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        editModal.hide();
        alert('Question updated successfully');
        location.reload();
    })
    .catch(err => alert('Error updating question'));
}

function previewAsset(questionId, assetType) {
    const modalBody = document.getElementById('previewModalBody');
    const modalLabel = document.getElementById('previewModalLabel');
    
    modalLabel.textContent = `Preview ${assetType}`;
    modalBody.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
    
    previewModal.show();
    
    fetch(`{{ url_for('dashboard.get_question_asset', question_id=0, asset_type='') }}${questionId}/assets/${assetType}`)
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                modalBody.innerHTML = `<p class="text-danger">${data.error}</p>`;
            } else {
                modalBody.innerHTML = `<img src="${data.url}" style="max-width:100%;" alt="${assetType}">`;
            }
        })
        .catch(err => {
            modalBody.innerHTML = `<p class="text-danger">Error loading preview</p>`;
        });
}
</script>
{% endblock %}
