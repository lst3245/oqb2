{% extends "base.html" %}

{% block title %}My Files - Question Bank{% endblock %}

{% block extra_css %}
<style>
    .status-badge { font-size: 0.85rem; }
    .file-row td { vertical-align: middle; }
    .bulk-bar { display: none; }
    .bulk-bar.show { display: flex; }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-file-earmark-word"></i> My Generated Files</h2>
        <div class="d-flex align-items-center gap-3">
            {% if current_user.is_super_admin %}
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="showAllToggle" onchange="loadFiles()">
                <label class="form-check-label" for="showAllToggle">Show all users</label>
            </div>
            {% endif %}
            <button class="btn btn-sm btn-outline-secondary" onclick="loadFiles()" title="Refresh">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <!-- Bulk action bar -->
    <div id="bulkBar" class="bulk-bar align-items-center gap-2 mb-2">
        <span id="selectedCount" class="text-muted small">0 selected</span>
        <button class="btn btn-sm btn-danger" onclick="bulkDelete()">
            <i class="bi bi-trash"></i> Delete Selected
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">Cancel</button>
    </div>

    <div id="filesContainer">
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading files...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let autoRefreshInterval = null;

document.addEventListener('DOMContentLoaded', function() {
    loadFiles();
    autoRefreshInterval = setInterval(() => {
        const hasGenerating = document.querySelector('.status-generating');
        if (hasGenerating) loadFiles();
    }, 5000);
});

function loadFiles() {
    const showAll = document.getElementById('showAllToggle')?.checked ? '1' : '0';
    
    fetch(`{{ url_for('user.files_list') }}?show_all=${showAll}`)
        .then(r => r.json())
        .then(files => {
            const container = document.getElementById('filesContainer');
            
            if (files.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> No generated files yet. 
                        Go to the <a href="{{ url_for('dashboard.index') }}">Dashboard</a>, 
                        select questions, and click Generate to create documents.
                    </div>`;
                updateBulkBar();
                return;
            }
            
            const showUsername = showAll === '1';
            
            let html = `
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th style="width:2.5rem"><input type="checkbox" class="form-check-input" id="selectAll" onchange="toggleAll(this)"></th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Questions</th>
                            ${showUsername ? '<th>User</th>' : ''}
                            <th>Created</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            files.forEach(f => {
                let statusBadge = '';
                let statusClass = '';
                switch (f.status) {
                    case 'pending':
                        statusBadge = '<span class="badge bg-warning text-dark status-badge status-generating"><span class="spinner-border spinner-border-sm" style="width:0.7rem;height:0.7rem;"></span> Pending</span>';
                        statusClass = 'status-generating';
                        break;
                    case 'generating':
                        statusBadge = '<span class="badge bg-info status-badge status-generating"><span class="spinner-border spinner-border-sm" style="width:0.7rem;height:0.7rem;"></span> Generating</span>';
                        statusClass = 'status-generating';
                        break;
                    case 'completed':
                        statusBadge = '<span class="badge bg-success status-badge"><i class="bi bi-check-circle"></i> Ready</span>';
                        break;
                    case 'failed':
                        statusBadge = `<span class="badge bg-danger status-badge" title="${escapeHtml(f.error_message || '')}"><i class="bi bi-x-circle"></i> Failed</span>`;
                        break;
                }
                
                const downloadBaseUrl = `{{ url_for('generator.download_file', file_id=0) }}`.replace('/0', `/${f.id}`);
                const downloadBtn = f.status === 'completed' 
                    ? `<a href="${downloadBaseUrl}" class="btn btn-sm btn-success" title="Download"><i class="bi bi-download"></i></a>`
                    : `<button class="btn btn-sm btn-success" disabled title="Not ready"><i class="bi bi-download"></i></button>`;
                
                const filterBtn = f.has_filter
                    ? `<a href="{{ url_for('dashboard.index') }}?filter_data_id=${f.id}" class="btn btn-sm btn-outline-primary" title="Reuse filter"><i class="bi bi-funnel"></i></a>`
                    : '';
                
                const regenBtn = f.has_generation_options
                    ? `<a href="{{ url_for('generator.index') }}?regen_file_id=${f.id}" class="btn btn-sm btn-outline-info" title="Regenerate with same options"><i class="bi bi-arrow-repeat"></i></a>`
                    : '';

                // File extension badge — colour-coded so PDF stands out vs DOCX vs ZIP.
                const extLabel = (f.file_ext || '').toLowerCase();
                const extColour = (
                    extLabel === 'pdf' ? 'bg-danger' :
                    extLabel === 'zip' ? 'bg-warning text-dark' :
                    'bg-primary'
                );
                const extBadge = extLabel
                    ? `<span class="badge ${extColour} ms-2" style="font-size:0.7rem;">.${escapeHtml(extLabel)}</span>`
                    : '';

                // Preferred-format icon — shows which asset format had highest
                // priority in this generation (first entry of format_priority).
                // IMG = image, MD = markdown, DOC = Word document.
                const fp = (f.format_priority_top || 'IMG').toUpperCase();
                const fpMeta = {
                    'IMG': {icon: 'bi-image', colour: 'text-success', label: 'Image-priority'},
                    'MD':  {icon: 'bi-markdown', colour: 'text-info', label: 'Markdown-priority'},
                    'DOC': {icon: 'bi-file-earmark-word', colour: 'text-primary', label: 'Word-document-priority'},
                }[fp] || {icon: 'bi-question', colour: 'text-muted', label: fp};
                const fpIcon = `<i class="bi ${fpMeta.icon} ${fpMeta.colour} ms-2" title="${fpMeta.label} (priority: ${escapeHtml(fp)})"></i>`;

                html += `
                        <tr class="file-row ${statusClass}">
                            <td><input type="checkbox" class="form-check-input row-check" value="${f.id}" onchange="updateBulkBar()"></td>
                            <td>
                                <strong>${escapeHtml(f.display_name)}</strong>
                                ${extBadge}
                                ${fpIcon}
                            </td>
                            <td>${statusBadge}</td>
                            <td><span class="badge bg-secondary">${f.question_count}</span></td>
                            ${showUsername ? `<td><span class="badge bg-info">${escapeHtml(f.username || '')}</span></td>` : ''}
                            <td><small class="text-muted">${formatLocalTime(f.created_at)}</small></td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    ${downloadBtn}
                                    ${regenBtn}
                                    ${filterBtn}
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteFile(${f.id})" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>`;
            });
            
            html += `
                    </tbody>
                </table>
            </div>`;
            
            container.innerHTML = html;
            updateBulkBar();
            
        })
        .catch(err => {
            document.getElementById('filesContainer').innerHTML = `
                <div class="alert alert-danger">Error loading files: ${err.message}</div>`;
        });
}

function toggleAll(master) {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = master.checked);
    updateBulkBar();
}

function updateBulkBar() {
    const checked = document.querySelectorAll('.row-check:checked');
    const bar = document.getElementById('bulkBar');
    const countEl = document.getElementById('selectedCount');
    if (checked.length > 0) {
        bar.classList.add('show');
        countEl.textContent = checked.length + ' selected';
    } else {
        bar.classList.remove('show');
    }
    // Sync "select all" checkbox
    const all = document.querySelectorAll('.row-check');
    const selectAll = document.getElementById('selectAll');
    if (selectAll) {
        selectAll.checked = all.length > 0 && checked.length === all.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < all.length;
    }
}

function clearSelection() {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = false);
    const selectAll = document.getElementById('selectAll');
    if (selectAll) selectAll.checked = false;
    updateBulkBar();
}

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.row-check:checked')).map(cb => parseInt(cb.value));
}

function bulkDelete() {
    const ids = getSelectedIds();
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} selected file(s)? This cannot be undone.`)) return;

    fetch(`{{ url_for('user.files_bulk_delete') }}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: ids})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            loadFiles();
        } else {
            alert(data.error || 'Error deleting files');
        }
    })
    .catch(err => alert('Error: ' + err.message));
}

function deleteFile(id) {
    if (!confirm('Delete this generated file? This cannot be undone.')) return;
    
    fetch(`{{ url_for('user.files_delete', file_id=0) }}`.replace('/0', `/${id}`), {
        method: 'DELETE'
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            loadFiles();
        } else {
            alert(data.error || 'Error deleting file');
        }
    })
    .catch(err => alert('Error: ' + err.message));
}

function formatLocalTime(utcStr) {
    if (!utcStr) return '';
    const d = new Date(utcStr);
    if (isNaN(d)) return utcStr;
    return d.toLocaleString(undefined, {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
