{% extends "base.html" %}

{% block title %}Search Profiles - Question Bank{% endblock %}

{% block extra_css %}
<style>
    .bulk-bar { display: none; }
    .bulk-bar.show { display: flex; }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-bookmark"></i> Search Profiles</h2>
        {% if current_user.is_super_admin %}
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="showAllToggle" onchange="loadProfiles()">
            <label class="form-check-label" for="showAllToggle">Show all users</label>
        </div>
        {% endif %}
    </div>

    <!-- Bulk action bar -->
    <div id="bulkBar" class="bulk-bar align-items-center gap-2 mb-2">
        <span id="selectedCount" class="text-muted small">0 selected</span>
        <button class="btn btn-sm btn-danger" onclick="bulkDelete()">
            <i class="bi bi-trash"></i> Delete Selected
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">Cancel</button>
    </div>

    <div id="profilesContainer">
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading profiles...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', loadProfiles);

function loadProfiles() {
    const showAll = document.getElementById('showAllToggle')?.checked ? '1' : '0';
    
    fetch(`{{ url_for('user.profiles_list') }}?show_all=${showAll}`)
        .then(r => r.json())
        .then(profiles => {
            const container = document.getElementById('profilesContainer');
            
            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> No saved profiles yet. 
                        Go to the <a href="{{ url_for('dashboard.index') }}">Dashboard</a>, 
                        set up your filters, and click the <i class="bi bi-floppy"></i> save button in the Filters header.
                    </div>`;
                updateBulkBar();
                return;
            }
            
            const showUsername = showAll === '1';
            
            let html = `
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width:2.5rem"><input type="checkbox" class="form-check-input" id="selectAll" onchange="toggleAll(this)"></th>
                            <th>Name</th>
                            <th>Subject</th>
                            ${showUsername ? '<th>User</th>' : ''}
                            <th>Created</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            profiles.forEach(p => {
                html += `
                        <tr>
                            <td><input type="checkbox" class="form-check-input row-check" value="${p.id}" onchange="updateBulkBar()"></td>
                            <td><strong>${escapeHtml(p.name)}</strong></td>
                            <td><span class="badge bg-secondary">${escapeHtml(p.subject || '-')}</span></td>
                            ${showUsername ? `<td><span class="badge bg-info">${escapeHtml(p.username || '')}</span></td>` : ''}
                            <td><small class="text-muted">${formatLocalTime(p.created_at)}</small></td>
                            <td class="text-end">
                                <a href="{{ url_for('dashboard.index') }}?profile_id=${p.id}" class="btn btn-sm btn-primary" title="Apply this filter">
                                    <i class="bi bi-play-fill"></i> Apply
                                </a>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProfile(${p.id})" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>`;
            });
            
            html += `
                    </tbody>
                </table>
            </div>`;
            
            container.innerHTML = html;
            updateBulkBar();
        })
        .catch(err => {
            document.getElementById('profilesContainer').innerHTML = `
                <div class="alert alert-danger">Error loading profiles: ${err.message}</div>`;
        });
}

function toggleAll(master) {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = master.checked);
    updateBulkBar();
}

function updateBulkBar() {
    const checked = document.querySelectorAll('.row-check:checked');
    const bar = document.getElementById('bulkBar');
    const countEl = document.getElementById('selectedCount');
    if (checked.length > 0) {
        bar.classList.add('show');
        countEl.textContent = checked.length + ' selected';
    } else {
        bar.classList.remove('show');
    }
    const all = document.querySelectorAll('.row-check');
    const selectAll = document.getElementById('selectAll');
    if (selectAll) {
        selectAll.checked = all.length > 0 && checked.length === all.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < all.length;
    }
}

function clearSelection() {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = false);
    const selectAll = document.getElementById('selectAll');
    if (selectAll) selectAll.checked = false;
    updateBulkBar();
}

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.row-check:checked')).map(cb => parseInt(cb.value));
}

function bulkDelete() {
    const ids = getSelectedIds();
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} selected profile(s)? This cannot be undone.`)) return;

    fetch(`{{ url_for('user.profiles_bulk_delete') }}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: ids})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            loadProfiles();
        } else {
            alert(data.error || 'Error deleting profiles');
        }
    })
    .catch(err => alert('Error: ' + err.message));
}

function deleteProfile(id) {
    if (!confirm('Delete this search profile?')) return;
    
    fetch(`{{ url_for('user.profiles_delete', profile_id=0) }}`.replace('/0', `/${id}`), {
        method: 'DELETE'
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            loadProfiles();
        } else {
            alert(data.error || 'Error deleting profile');
        }
    })
    .catch(err => alert('Error: ' + err.message));
}

function formatLocalTime(utcStr) {
    if (!utcStr) return '';
    const d = new Date(utcStr);
    if (isNaN(d)) return utcStr;
    return d.toLocaleString(undefined, {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
